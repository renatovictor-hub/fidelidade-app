<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App teste</title><style>
:root{--p:#6a0dad;--a:#ffcc00;--bg:#f5f3f7;--line:#e9e3ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto;color:#302a34}.phone{max-width:430px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 32px rgba(0,0,0,.08)}header{background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 70%,white));color:#fff;padding:25px 20px 20px;border-bottom:5px solid var(--a)}header h1{margin:0;font-size:23px}header p{margin:5px 0 0;opacity:.88}.body{padding:16px}.card{border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;background:#fff}.saldo{background:var(--p);color:#fff;border:0}.saldo small{opacity:.85}.saldo b{display:block;font-size:34px;margin-top:3px}label{display:block;font-size:12px;font-weight:800;margin:9px 0 4px}input{width:100%;min-height:43px;border:1px solid #ddd3e2;border-radius:10px;padding:10px;font:inherit}button{width:100%;border:0;border-radius:11px;padding:12px;font-weight:850;background:var(--p);color:#fff;margin-top:10px}.hidden{display:none}.meta{font-size:12px;color:#756d79}.reward,.move{padding:10px 0;border-bottom:1px solid #eee}.reward:last-child,.move:last-child{border-bottom:0}.reward b,.move b{display:block}.pill{display:inline-block;background:#f0e6f7;color:#67218f;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:800}.err{color:#ad2828;font-size:12px;margin-top:8px}.wa{display:block;background:#25d366;color:#fff;text-decoration:none;text-align:center;padding:12px;border-radius:11px;font-weight:850;margin-top:10px}
</style></head><body><div class="phone"><header><h1 id="companyName">Carregando...</h1><p id="companyMeta"></p></header><div class="body">
<section id="authCard" class="card"><b>Cliente de teste</b><div class="meta">O cadastro abaixo é salvo somente dentro desta empresa.</div><label>Nome</label><input id="name" placeholder="Nome do cliente"><label>Telefone (10 dígitos)</label><input id="phone" inputmode="numeric" placeholder="9981234567"><label>Data de nascimento</label><input id="birth" type="date"><button onclick="register()">CRIAR / ENTRAR</button><div id="authMsg" class="err"></div></section>
<section id="profile" class="hidden"><div class="card saldo"><small>Saldo disponível</small><b><span id="points">0</span> pts</b><div>Pontos acumulados: <span id="acc">0</span></div></div><div class="card"><b id="clientName"></b><div class="meta" id="clientPhone"></div><button onclick="refreshAll()">ATUALIZAR DADOS</button></div>
<div class="card"><b>Recompensas</b><div id="rewards" class="meta" style="margin-top:8px">Carregando...</div></div><div class="card"><b>Movimentos</b><div id="moves" class="meta" style="margin-top:8px">Carregando...</div></div><a id="wa" class="wa hidden" target="_blank">WHATSAPP</a></section>
</div></div><script>
const company=new URLSearchParams(location.search).get("company")||"uai-so",key=x=>"tenant_"+company+"_"+x,$=x=>document.getElementById(x);
async function json(url,o={}){const r=await fetch(url,{cache:"no-store",credentials:"same-origin",...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Erro");return d}
async function boot(){try{const d=await json("/api/superadmin?action=public_company&company="+encodeURIComponent(company)),c=d.company;document.documentElement.style.setProperty("--p",c.branding?.primary||"#6a0dad");document.documentElement.style.setProperty("--a",c.branding?.secondary||"#ffcc00");$("companyName").textContent=c.name;$("companyMeta").textContent=(c.city||"")+" · "+(c.country||"")+" · "+c.id;if(c.whatsapp){$("wa").href="https://wa.me/"+String(c.whatsapp).replace(/\D/g,"");$("wa").classList.remove("hidden")}const uid=localStorage.getItem(key("uid")),phone=localStorage.getItem(key("phone")),birth=localStorage.getItem(key("birth"));if(uid&&phone&&birth){try{await json("/api/cliente",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"session_restore",uid,telefone:phone,nascimento:birth,company})});await show(uid)}catch{}}}catch(e){$("companyName").textContent="Empresa não encontrada";$("companyMeta").textContent=e.message}}
async function register(){try{$("authMsg").textContent="";const nome=$("name").value.trim(),telefone=$("phone").value.replace(/\D/g,""),nascimento=$("birth").value;const d=await json("/api/cliente",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"auth_register",nome,telefone,nascimento,company})});localStorage.setItem(key("uid"),d.uid);localStorage.setItem(key("phone"),telefone);localStorage.setItem(key("birth"),nascimento);await show(d.uid)}catch(e){$("authMsg").textContent=e.message}}
async function show(uid){$("authCard").classList.add("hidden");$("profile").classList.remove("hidden");await refreshAll(uid)}
async function refreshAll(uid=localStorage.getItem(key("uid"))){const q="&company="+encodeURIComponent(company);const p=await json("/api/cliente?uid="+encodeURIComponent(uid)+q);$("points").textContent=p.pontos||0;$("acc").textContent=p.pontos_acumulados||0;$("clientName").textContent=p.nome||"Cliente";$("clientPhone").textContent=p.telefone||"";try{const r=await json("/api/recompensas-publicas?company="+encodeURIComponent(company));$("rewards").innerHTML=(r.recompensas||[]).length?(r.recompensas||[]).map(x=>'<div class="reward"><b>'+x.nome+'</b><span class="pill">'+x.pontos+' pts</span><div>'+ (x.descricao||"")+'</div></div>').join(""):"Nenhuma recompensa cadastrada nesta empresa."}catch(e){$("rewards").textContent=e.message}try{const h=await json("/api/historico?public=1&uid="+encodeURIComponent(uid)+"&company="+encodeURIComponent(company));const arr=h.historico||h.movimentos||h.transacoes||[];$("moves").innerHTML=arr.length?arr.map(x=>'<div class="move"><b>'+ (x.descricao||x.origem||x.tipo||"Movimento")+'</b><div>'+ (x.pontos??x.valor??"")+'</div></div>').join(""):"Nenhum movimento ainda."}catch(e){$("moves").textContent=e.message}}
boot();
</script></body></html>
