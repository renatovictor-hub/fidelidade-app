<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uai Sô - Acceso Administrativo</title>
    <style>
        :root {
            --roxo:#6a0dad;
            --amarelo:#ffcc00;
        }
        * { box-sizing:border-box; }
        html, body { margin:0; min-height:100%; }
        body {
            min-height:100vh;
            background:#f0f2f5;
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            color:#333;
        }
        #loginView {
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .login-card {
            width:100%;
            max-width:390px;
            background:white;
            border-radius:18px;
            padding:30px;
            box-shadow:0 12px 35px rgba(0,0,0,.12);
            border-top:5px solid var(--amarelo);
        }
        h1 { color:var(--roxo); margin:0 0 6px; font-size:25px; }
        p { color:#777; margin:0 0 22px; }
        label { display:block; font-size:14px; font-weight:700; margin-bottom:7px; }
        input {
            width:100%;
            padding:14px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:16px;
            outline-color:var(--roxo);
        }
        button {
            border:0;
            border-radius:10px;
            font-size:16px;
            font-weight:800;
            cursor:pointer;
        }
        #btnLogin {
            width:100%;
            margin-top:15px;
            padding:14px;
            background:var(--roxo);
            color:white;
        }
        button:disabled { opacity:.6; cursor:not-allowed; }
        #erro { min-height:20px; margin-top:12px; color:#c0392b; font-size:13px; }

        #dashboardView {
            display:none;
            min-height:100vh;
            background:#f0f2f5;
        }
        .admin-bar {
            height:54px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            padding:8px 14px;
            background:#fff;
            border-bottom:3px solid var(--amarelo);
            position:sticky;
            top:0;
            z-index:10000;
            box-shadow:0 2px 8px rgba(0,0,0,.08);
        }
        .admin-bar strong { color:var(--roxo); }
        .admin-bar small { color:#777; margin-left:8px; }
        #btnLogout {
            width:auto;
            padding:9px 14px;
            background:#eee;
            color:#6a0dad;
        }
        #dashboardFrame {
            display:block;
            width:100%;
            height:calc(100vh - 54px);
            border:0;
            background:#f0f2f5;
        }
        @media (max-width:600px) {
            .admin-bar small { display:none; }
            .admin-bar { height:50px; }
            #dashboardFrame { height:calc(100vh - 50px); }
        }
    </style>
</head>
<body>
    <section id="loginView">
        <div class="login-card">
            <h1>Uai Sô</h1>
            <p>Acceso seguro al panel administrativo</p>

            <form id="loginForm">
                <label for="password">Contraseña</label>
                <input id="password" type="password" autocomplete="current-password" required autofocus>
                <button id="btnLogin" type="submit">ENTRAR AL DASHBOARD</button>
                <div id="erro"></div>
            </form>
        </div>
    </section>

    <section id="dashboardView">
        <div class="admin-bar">
            <div>
                <strong>Uai Sô Admin</strong>
                <small>Bloqueo automático activo</small>
            </div>
            <button id="btnLogout" type="button">🔒 CERRAR SESIÓN</button>
        </div>
        <iframe id="dashboardFrame" title="Dashboard Uai Sô"></iframe>
    </section>

    <script>
        const TAB_KEY = 'uaiso_admin_tab_unlocked';
        const INACTIVITY_MS = 10 * 60 * 1000;
        const BACKGROUND_LOCK_MS = 30 * 1000;

        let inactivityTimer = null;
        let hiddenAt = null;
        let logoutInProgress = false;

        const loginView = document.getElementById('loginView');
        const dashboardView = document.getElementById('dashboardView');
        const dashboardFrame = document.getElementById('dashboardFrame');
        const passwordInput = document.getElementById('password');
        const erro = document.getElementById('erro');

        function mostrarLogin(mensagem = '') {
            dashboardView.style.display = 'none';
            loginView.style.display = 'flex';
            dashboardFrame.removeAttribute('src');
            passwordInput.value = '';
            erro.textContent = mensagem;
            setTimeout(() => passwordInput.focus(), 50);
        }

        function mostrarDashboard() {
            loginView.style.display = 'none';
            dashboardView.style.display = 'block';
            if (!dashboardFrame.getAttribute('src')) {
                dashboardFrame.src = '/dashboard.html';
            }
            reiniciarInatividade();
        }

        async function encerrarSessao(mensagem = 'Sesión cerrada. Ingresa tu contraseña nuevamente.') {
            if (logoutInProgress) return;
            logoutInProgress = true;

            clearTimeout(inactivityTimer);
            sessionStorage.removeItem(TAB_KEY);

            try {
                await fetch('/api/admin-auth', {
                    method:'DELETE',
                    cache:'no-store',
                    keepalive:true
                });
            } catch (_) {}

            logoutInProgress = false;
            mostrarLogin(mensagem);
        }

        function reiniciarInatividade() {
            clearTimeout(inactivityTimer);
            if (dashboardView.style.display !== 'block') return;

            inactivityTimer = setTimeout(() => {
                encerrarSessao('Panel bloqueado por inactividad. Ingresa tu contraseña nuevamente.');
            }, INACTIVITY_MS);
        }

        async function verificarSessaoInicial() {
            try {
                const res = await fetch('/api/admin-auth', { cache:'no-store' });
                const data = await res.json();
                const tabDesbloqueada = sessionStorage.getItem(TAB_KEY) === '1';

                if (data.authenticated && tabDesbloqueada) {
                    mostrarDashboard();
                    return;
                }

                if (data.authenticated && !tabDesbloqueada) {
                    await fetch('/api/admin-auth', {
                        method:'DELETE',
                        cache:'no-store'
                    });
                }
            } catch (_) {}

            mostrarLogin();
        }

        document.getElementById('loginForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const btn = document.getElementById('btnLogin');
            const password = passwordInput.value;

            btn.disabled = true;
            btn.textContent = 'VERIFICANDO...';
            erro.textContent = '';

            try {
                const res = await fetch('/api/admin-auth', {
                    method:'POST',
                    headers:{ 'Content-Type':'application/json' },
                    body:JSON.stringify({ password })
                });
                const data = await res.json();

                if (!res.ok || !data.authenticated) {
                    throw new Error(data.error || 'No se pudo iniciar sesión');
                }

                sessionStorage.setItem(TAB_KEY, '1');
                mostrarDashboard();
            } catch (e) {
                erro.textContent = e.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'ENTRAR AL DASHBOARD';
            }
        });

        document.getElementById('btnLogout').addEventListener('click', () => {
            encerrarSessao('Sesión cerrada correctamente.');
        });

        ['pointerdown','keydown','touchstart'].forEach(eventName => {
            document.addEventListener(eventName, reiniciarInatividade, { passive:true });
        });

        window.addEventListener('message', reiniciarInatividade);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                hiddenAt = Date.now();
                return;
            }

            if (
                hiddenAt &&
                Date.now() - hiddenAt >= BACKGROUND_LOCK_MS &&
                dashboardView.style.display === 'block'
            ) {
                encerrarSessao('Panel bloqueado al salir de la app. Ingresa tu contraseña nuevamente.');
                return;
            }

            hiddenAt = null;
            reiniciarInatividade();
        });

        verificarSessaoInicial();
    </script>
</body>
</html>
