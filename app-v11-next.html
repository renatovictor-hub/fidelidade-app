<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6a0dad">
<title>Uai Sô Fidelidad 1.1</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f5f9}iframe{display:block;width:100%;height:100%;border:0;background:#f7f5f9}</style>
</head><body><iframe id="app" title="Uai Sô Fidelidad v1.1"></iframe><script>
const src=new URL('/app-v11.html',location.origin);for(const[k,v]of new URLSearchParams(location.search))src.searchParams.set(k,v);src.hash=location.hash||'#home';const frame=document.getElementById('app');frame.src=src.toString();
frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;const style=d.createElement('style');style.textContent=`
.offer-wa{width:100%;margin-top:10px;border:0;border-radius:11px;padding:11px 12px;background:#25d366;color:#fff;font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}.offer-countdown{display:inline-flex;margin:8px 0 0;padding:6px 8px;border-radius:9px;background:#f5effa;color:#6a0dad;font-size:9px;font-weight:800}.offer.expired .offer-countdown,.offer.expired .offer-wa{display:none!important}.benefit-complete{background:#f6f3f7!important;border-color:#e5dfe8!important}.reward{position:relative;flex-wrap:wrap}.reward .body{padding-right:4px}.reward-availability{display:inline-block;margin-top:6px;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:900}.reward-availability.ok{background:#e8f7ee;color:#198754}.reward-availability.no{background:#f1eff2;color:#756d79}.reward button.reward-ready{background:#6a0dad!important;color:#fff!important}.reward button.reward-locked{background:#ece8ef!important;color:#817887!important;cursor:not-allowed!important}.qr-close-v11{position:absolute;top:14px;right:14px;width:38px;height:38px;border:0;border-radius:50%;background:#fff;color:#6a0dad;font-size:22px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.13);z-index:20;display:flex;align-items:center;justify-content:center;cursor:pointer}.screen#screen-qr{position:relative}.profile-points-note{font-size:10px;color:#777;margin-top:3px;line-height:1.3}.nav{position:relative}.nav-badge-v11{position:absolute;top:4px;right:18px;min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:#dc3545;color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.12)}.nav[data-tab="qr"] .nav-badge-v11{display:none}.nav-badge-v11.hidden{display:none}
`;d.head.appendChild(style);
let promoCache=[],clientState=null,syncing=false,syncTimer=null,lastTab='home',liveRefreshing=false;
async function getPromos(){try{const r=await fetch('https://fidelidade-app-9671c-default-rtdb.firebaseio.com/promos.json?t='+Date.now(),{cache:'no-store'});const raw=await r.json()||{};promoCache=Object.entries(raw).map(([id,p])=>({id,...(p||{})}))}catch(_){promoCache=[]}}
async function getClient(){try{const uid=new URLSearchParams(location.search).get('uid')||'';if(!uid)return;const r=await fetch('/api/cliente?uid='+encodeURIComponent(uid)+'&t='+Date.now(),{cache:'no-store'});if(r.ok)clientState=await r.json()}catch(_){clientState=null}}
function setNavBadge(tab,count){const nav=d.querySelector(`.nav[data-tab="${tab}"]`);if(!nav)return;let b=nav.querySelector('.nav-badge-v11');if(!b){b=d.createElement('span');b.className='nav-badge-v11';nav.appendChild(b)}const n=Math.max(0,Number(count)||0);b.textContent=n>9?'9+':String(n);b.classList.toggle('hidden',n===0)}
function titleOf(p){return String(p?.titulo||p?.title||p?.nome||'').trim()}function descOf(p){return String(p?.desc||p?.texto||p?.descricao||p?.descripcion||p?.mensagem||'').trim()}function endOf(p){if(Number.isFinite(Number(p?.exp))&&Number(p.exp)>0)return Number(p.exp);return p?.fim||p?.fecha_fin||p?.expires_at||p?.validade||''}function endTs(p){const e=endOf(p),n=Number(e);if(Number.isFinite(n)&&n>0)return n<1e12?n*1000:n;const ts=new Date(e).getTime();return Number.isFinite(ts)?ts:NaN}function isActive(p){if(p?.ativa===false||p?.activo===false)return false;const ts=endTs(p);return Number.isFinite(ts)?ts>Date.now():true}function currentLists(){const active=promoCache.filter(isActive).sort((a,b)=>(endTs(a)||Infinity)-(endTs(b)||Infinity));const expired=promoCache.filter(p=>!isActive(p)).sort((a,b)=>(endTs(b)||0)-(endTs(a)||0));return{active,expired}}function matchPromo(card){const t=card.querySelector('h3')?.textContent.trim()||'';return promoCache.find(p=>titleOf(p)===t)||null}function formatLeft(p){const ts=endTs(p);if(!Number.isFinite(ts)||ts<=Date.now())return'';const diff=ts-Date.now(),h=Math.floor(diff/36e5),m=Math.floor(diff%36e5/6e4);return h>=24?`⏳ Termina en ${Math.floor(h/24)}d ${h%24}h`:`⏳ Termina en ${h}h ${m}min`}function openWhatsApp(p,card){const title=titleOf(p)||card.querySelector('h3')?.textContent.trim()||'Promoción Uai Sô';w.open('https://api.whatsapp.com/send?phone=5219986023759&text='+encodeURIComponent(`Hola! Quiero la promo: ${title}`),'_blank','noopener')}
function promoHtml(p,expired=false){const img=p?.imagem||p?.image||p?.foto||'',title=titleOf(p)||'Promoción especial',desc=descOf(p);return `<article class="offer ${expired?'expired':''}">${img?`<img src="${String(img).replace(/"/g,'&quot;')}" onerror="this.style.display='none'">`:''}<div class="body"><h3>${title.replace(/</g,'&lt;')}</h3><p>${desc.replace(/</g,'&lt;')}</p><span class="tag">${expired?'FINALIZADA':'ACTIVA'}</span></div></article>`}
function renderOffersTab(active,expired){const el=d.getElementById('offersList');if(!el)return;const a=d.querySelector('[data-offer-tab="active"]')?.classList.contains('active'),p=d.querySelector('[data-offer-tab="previous"]')?.classList.contains('active'),b=d.querySelector('[data-offer-tab="benefits"]')?.classList.contains('active');if(a)el.innerHTML=active.length?active.map(x=>promoHtml(x)).join(''):'<div class="empty">No hay promociones activas ahora.</div>';else if(p)el.innerHTML=expired.length?expired.map(x=>promoHtml(x,true)).join(''):'<div class="empty">Todavía no hay promociones anteriores.</div>';else if(b&&typeof w.renderOfferTab==='function')try{w.renderOfferTab()}catch(_){}}
function rerenderPromos(){if(syncing)return;syncing=true;try{const{active,expired}=currentLists(),home=d.getElementById('homeOffers'),pb=d.getElementById('previousBlock'),hp=d.getElementById('homePrevious');setNavBadge('offers',active.length);if(home)home.innerHTML=active.length?active.slice(0,2).map(x=>promoHtml(x)).join(''):'<div class="empty">No hay promociones activas ahora.</div>';if(pb&&hp){pb.style.display=expired.length?'block':'none';hp.innerHTML=expired.slice(0,5).map(x=>promoHtml(x,true)).join('')}renderOffersTab(active,expired)}finally{syncing=false}}
function enhancePromos(){d.querySelectorAll('.offer:not(.expired)').forEach(card=>{const p=matchPromo(card),body=card.querySelector('.body');if(!body)return;let timer=body.querySelector('.offer-countdown'),left=p?formatLeft(p):'';if(left){if(!timer){timer=d.createElement('div');timer.className='offer-countdown';body.appendChild(timer)}timer.textContent=left}else timer?.remove();if(!body.querySelector('.offer-wa')){const b=d.createElement('button');b.className='offer-wa';b.type='button';b.innerHTML='💬 PEDIR POR WHATSAPP';b.onclick=()=>openWhatsApp(p,card);body.appendChild(b)}})}
function enhanceRewards(){const saldo=Math.max(0,Number(clientState?.pontos||0));let disponibles=0;d.querySelectorAll('#rewardsList .reward').forEach(card=>{const custo=Math.max(0,Number(String(card.querySelector('.pts')?.textContent||'').replace(/\D/g,''))||0),body=card.querySelector('.body'),btn=card.querySelector('button');if(!body||!btn||!custo)return;const falta=Math.max(0,custo-saldo);let badge=body.querySelector('.reward-availability');if(!badge){badge=d.createElement('div');badge.className='reward-availability';body.appendChild(badge)}btn.onclick=null;if(!falta){disponibles++;badge.className='reward-availability ok';badge.textContent='✓ Disponible para canjear';btn.disabled=false;btn.className='reward-ready';btn.textContent='MOSTRAR QR';btn.onclick=()=>{lastTab='rewards';if(typeof w.go==='function')w.go('qr');addQrClose()}}else{badge.className='reward-availability no';badge.textContent=`Te faltan ${falta} puntos`;btn.disabled=true;btn.className='reward-locked';btn.textContent=`FALTAN ${falta}`}});setNavBadge('rewards',disponibles)}
function addQrClose(){const qr=d.getElementById('screen-qr');if(!qr||qr.querySelector('.qr-close-v11'))return;const b=d.createElement('button');b.className='qr-close-v11';b.type='button';b.setAttribute('aria-label','Cerrar QR');b.innerHTML='×';b.onclick=()=>{if(typeof w.go==='function')w.go(lastTab||'home')};qr.appendChild(b)}
function enhanceProfile(){if(!clientState)return;const stats=d.querySelector('#screen-profile .stats');if(stats){const first=stats.querySelector('.stat span');if(first)first.textContent='Disponibles'}const dataCard=[...d.querySelectorAll('#screen-profile .card')].find(x=>x.querySelector('h3')?.textContent.trim()==='Mis datos');if(dataCard){let row=dataCard.querySelector('[data-accumulated-row]');if(!row){row=d.createElement('div');row.className='data-row';row.setAttribute('data-accumulated-row','1');const version=[...dataCard.querySelectorAll('.data-row')].find(x=>x.textContent.includes('Versión'));if(version)dataCard.insertBefore(row,version);else dataCard.appendChild(row)}row.innerHTML=`<span>⭐ Puntos acumulados</span><b>${Math.max(0,Number(clientState.pontos_acumulados||clientState.pontos||0))}</b>`}const progress=d.getElementById('profileProgressTxt');if(progress&&!progress.parentElement.querySelector('.profile-points-note')){const note=d.createElement('div');note.className='profile-points-note';note.textContent='El nivel se calcula con tus puntos acumulados; los puntos disponibles pueden bajar cuando canjeas recompensas.';progress.insertAdjacentElement('afterend',note)}}
function fixMovementRenderer(){if(typeof w.renderMoves!=='function')return;w.renderMoves=function(target,items){const el=d.getElementById(target);if(!el)return;if(!items?.length){el.innerHTML='<div class="empty">Todavía no hay movimientos.</div>';return}el.innerHTML=items.map(m=>{const deb=m?.tipo==='debito'||Number(m?.pontos)<0,v=Math.abs(Number(m?.pontos||0)),icon=typeof w.moveIcon==='function'?w.moveIcon(m):'⭐',title=typeof w.moveTitle==='function'?w.moveTitle(m):(deb?'Canje de recompensa':'Puntos acreditados'),date=typeof w.fmtDate==='function'?w.fmtDate(m.data,true):'',safe=typeof w.esc==='function'?w.esc(title):String(title||'');return `<div class="move"><div class="icon">${icon}</div><div class="main"><b>${safe}</b><span>${date}</span></div><div class="amount ${deb?'minus':'plus'}">${deb?'-':'+'}${v}</div></div>`}).join('')};if(typeof w.loadMoves==='function')w.loadMoves()}
function showGoogleStatus(){if(!clientState)return;const benefits=d.getElementById('offersList'),tab=d.querySelector('[data-offer-tab="benefits"]')?.classList.contains('active');if(!benefits||!tab)return;if(clientState.google_review_clicked===true&&!benefits.querySelector('[data-google-complete]'))benefits.insertAdjacentHTML('beforeend','<div class="benefit benefit-complete" data-google-complete="1"><div class="benefit-head"><div class="benefit-icon">✓</div><div class="benefit-main"><h3>Google Review</h3><p>Gracias. Ya utilizaste la invitación para evaluar Uai Sô en Google.</p></div></div></div>')}
async function refreshLive(){if(liveRefreshing)return;liveRefreshing=true;try{await Promise.all([getPromos(),getClient()]);if(typeof w.loadClient==='function')await w.loadClient();if(typeof w.loadMoves==='function')await w.loadMoves();if(typeof w.loadVip==='function')await w.loadVip();rerenderPromos();enhancePromos();enhanceRewards();enhanceProfile();showGoogleStatus()}catch(e){console.warn('Live refresh v1.1:',e)}finally{liveRefreshing=false}}
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>{rerenderPromos();enhancePromos();enhanceRewards();addQrClose();enhanceProfile();showGoogleStatus()},80)}d.querySelectorAll('[data-offer-tab]').forEach(btn=>btn.addEventListener('click',()=>setTimeout(()=>{rerenderPromos();enhancePromos();showGoogleStatus()},0)));d.querySelector('[data-tab="rewards"]')?.addEventListener('click',async()=>{lastTab='rewards';await refreshLive();setTimeout(enhanceRewards,80)});d.querySelector('[data-tab="profile"]')?.addEventListener('click',async()=>{lastTab='profile';await refreshLive();setTimeout(enhanceProfile,50)});d.querySelectorAll('.nav').forEach(btn=>btn.addEventListener('click',()=>{if(btn.dataset.tab&&btn.dataset.tab!=='qr')lastTab=btn.dataset.tab}));w.addEventListener('focus',refreshLive);w.addEventListener('pageshow',refreshLive);d.addEventListener('visibilitychange',()=>{if(d.visibilityState==='visible')refreshLive()});const obs=new MutationObserver(()=>{if(!syncing)scheduleSync()});obs.observe(d.body,{childList:true,subtree:true});Promise.all([getPromos(),getClient()]).then(()=>{fixMovementRenderer();rerenderPromos();enhancePromos();enhanceRewards();addQrClose();enhanceProfile();showGoogleStatus();setInterval(refreshLive,15000)})});
</script></body></html>
