<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6a0dad">
<title>Uai Sô Fidelidad 1.1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f5f9}iframe{display:block;width:100%;height:100%;border:0;background:#f7f5f9}
</style>
</head>
<body>
<iframe id="app" title="Uai Sô Fidelidad v1.1"></iframe>
<script>
const src=new URL('/app-v11.html',location.origin);
for(const [k,v] of new URLSearchParams(location.search)) src.searchParams.set(k,v);
src.hash=location.hash||'#home';
const frame=document.getElementById('app');
frame.src=src.toString();

frame.addEventListener('load',()=>{
  const w=frame.contentWindow,d=frame.contentDocument;
  if(!w||!d)return;

  const style=d.createElement('style');
  style.textContent=`
    .offer-wa{width:100%;margin-top:10px;border:0;border-radius:11px;padding:11px 12px;background:#25d366;color:#fff;font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;text-decoration:none}
    .offer-countdown{display:inline-flex;align-items:center;gap:5px;margin:8px 0 0;padding:6px 8px;border-radius:9px;background:#f5effa;color:#6a0dad;font-size:9px;font-weight:800}
    .offer.expired .offer-countdown,.offer.expired .offer-wa{display:none!important}
    .benefit-complete{background:#f6f3f7!important;border-color:#e5dfe8!important}
    .benefit-complete .benefit-icon{background:#ece7ef!important}
    .benefit-complete .benefit-main h3{color:#726a77!important}
    .reward{position:relative;flex-wrap:wrap}
    .reward .body{padding-right:4px}
    .reward-availability{display:inline-block;margin-top:6px;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:900}
    .reward-availability.ok{background:#e8f7ee;color:#198754}
    .reward-availability.no{background:#f1eff2;color:#756d79}
    .reward button.reward-ready{background:#6a0dad!important;color:#fff!important}
    .reward button.reward-locked{background:#ece8ef!important;color:#817887!important;cursor:not-allowed!important}
  `;
  d.head.appendChild(style);

  let promoCache=[];
  let clientState=null;
  let syncing=false;
  let syncTimer=null;

  async function getPromos(){
    try{
      const r=await fetch('https://fidelidade-app-9671c-default-rtdb.firebaseio.com/promos.json?t='+Date.now(),{cache:'no-store'});
      const raw=await r.json()||{};
      promoCache=Object.entries(raw).map(([id,p])=>({id,...(p||{})}));
    }catch(_){promoCache=[]}
  }
  async function getClient(){
    try{
      const uid=new URLSearchParams(location.search).get('uid')||'';
      if(!uid)return;
      const r=await fetch('/api/cliente?uid='+encodeURIComponent(uid)+'&t='+Date.now(),{cache:'no-store'});
      if(r.ok)clientState=await r.json();
    }catch(_){clientState=null}
  }

  function titleOf(p){return String(p?.titulo||p?.title||p?.nome||'').trim()}
  function descOf(p){return String(p?.desc||p?.texto||p?.descricao||p?.descripcion||p?.mensagem||'').trim()}
  function endOf(p){
    if(Number.isFinite(Number(p?.exp))&&Number(p.exp)>0)return Number(p.exp);
    return p?.fim||p?.fecha_fin||p?.expires_at||p?.validade||'';
  }
  function endTs(p){
    const end=endOf(p);
    if(typeof end==='number'){
      if(end>0&&end<1000000000000)return end*1000;
      return end;
    }
    const n=Number(end);
    if(Number.isFinite(n)&&n>0){
      if(n<1000000000000)return n*1000;
      return n;
    }
    const ts=new Date(end).getTime();
    return Number.isFinite(ts)?ts:NaN;
  }
  function isActive(p){
    if(p?.ativa===false||p?.activo===false)return false;
    const ts=endTs(p);
    if(Number.isFinite(ts))return ts>Date.now();
    return true;
  }
  function currentLists(){
    const active=promoCache.filter(isActive).sort((a,b)=>{
      const aa=endTs(a),bb=endTs(b);
      if(!Number.isFinite(aa)&&!Number.isFinite(bb))return 0;
      if(!Number.isFinite(aa))return 1;
      if(!Number.isFinite(bb))return -1;
      return aa-bb;
    });
    const expired=promoCache.filter(p=>!isActive(p)).sort((a,b)=>{
      const aa=endTs(a),bb=endTs(b);
      return (Number.isFinite(bb)?bb:0)-(Number.isFinite(aa)?aa:0);
    });
    return {active,expired};
  }
  function matchPromo(card){
    const t=card.querySelector('h3')?.textContent.trim()||'';
    return promoCache.find(p=>titleOf(p)===t)||promoCache.find(p=>t&&titleOf(p).includes(t))||null;
  }
  function formatLeft(p){
    const ts=endTs(p);if(!Number.isFinite(ts))return'';
    const diff=ts-Date.now();if(diff<=0)return'';
    const h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000);
    if(h>=24){const days=Math.floor(h/24),hrs=h%24;return `⏳ Termina en ${days}d ${hrs}h`;}
    return `⏳ Termina en ${h}h ${m}min`;
  }
  function openWhatsApp(p,card){
    const title=titleOf(p)||card.querySelector('h3')?.textContent.trim()||'Promoción Uai Sô';
    const text=`Hola! Quiero la promo: ${title}`;
    w.open('https://api.whatsapp.com/send?phone=5219986023759&text='+encodeURIComponent(text),'_blank','noopener');
  }

  function promoHtml(p,expired=false){
    const img=p?.imagem||p?.image||p?.foto||'';
    const title=titleOf(p)||'Promoción especial';
    const desc=descOf(p)||'';
    return `<article class="offer ${expired?'expired':''}">${img?`<img src="${String(img).replace(/"/g,'&quot;')}" onerror="this.style.display='none'">`:''}<div class="body"><h3>${title.replace(/</g,'&lt;')}</h3><p>${desc.replace(/</g,'&lt;')}</p><span class="tag">${expired?'FINALIZADA':'ACTIVA'}</span></div></article>`;
  }

  function renderOffersTab(active,expired){
    const offerList=d.getElementById('offersList');
    if(!offerList)return;
    const activeTab=d.querySelector('[data-offer-tab="active"]')?.classList.contains('active');
    const previousTab=d.querySelector('[data-offer-tab="previous"]')?.classList.contains('active');
    const benefitsTab=d.querySelector('[data-offer-tab="benefits"]')?.classList.contains('active');
    if(activeTab){
      offerList.innerHTML=active.length?active.map(p=>promoHtml(p,false)).join(''):'<div class="empty">No hay promociones activas ahora.</div>';
    }else if(previousTab){
      offerList.innerHTML=expired.length?expired.map(p=>promoHtml(p,true)).join(''):'<div class="empty">Todavía no hay promociones anteriores.</div>';
    }else if(benefitsTab&&typeof w.renderOfferTab==='function'){
      try{w.renderOfferTab()}catch(_){}
    }
  }

  function rerenderPromos(){
    if(syncing)return;
    syncing=true;
    try{
      const {active,expired}=currentLists();
      const home=d.getElementById('homeOffers');
      const prevBlock=d.getElementById('previousBlock');
      const homePrev=d.getElementById('homePrevious');
      if(home)home.innerHTML=active.length?active.slice(0,2).map(p=>promoHtml(p,false)).join(''):'<div class="empty">No hay promociones activas ahora.</div>';
      if(prevBlock&&homePrev){
        prevBlock.style.display=expired.length?'block':'none';
        homePrev.innerHTML=expired.slice(0,5).map(p=>promoHtml(p,true)).join('');
      }
      renderOffersTab(active,expired);
    }finally{
      syncing=false;
    }
  }

  function enhancePromos(){
    d.querySelectorAll('.offer:not(.expired)').forEach(card=>{
      const p=matchPromo(card);
      const body=card.querySelector('.body');if(!body)return;
      let timer=body.querySelector('.offer-countdown');
      const left=p?formatLeft(p):'';
      if(left){if(!timer){timer=d.createElement('div');timer.className='offer-countdown';body.appendChild(timer)}timer.textContent=left}
      else if(timer)timer.remove();
      if(!body.querySelector('.offer-wa')){
        const b=d.createElement('button');b.className='offer-wa';b.type='button';b.innerHTML='💬 PEDIR POR WHATSAPP';b.addEventListener('click',()=>openWhatsApp(p,card));body.appendChild(b);
      }
    });
  }

  function enhanceRewards(){
    const saldo=Math.max(0,Number(clientState?.pontos||0));
    d.querySelectorAll('#rewardsList .reward').forEach(card=>{
      const ptsEl=card.querySelector('.pts');
      const custo=Math.max(0,Number(String(ptsEl?.textContent||'').replace(/\D/g,''))||0);
      const body=card.querySelector('.body');
      const btn=card.querySelector('button');
      if(!body||!btn||!custo)return;
      const falta=Math.max(0,custo-saldo);
      let badge=body.querySelector('.reward-availability');
      if(!badge){badge=d.createElement('div');badge.className='reward-availability';body.appendChild(badge)}
      btn.onclick=null;
      if(falta===0){
        badge.className='reward-availability ok';badge.textContent='✓ Disponible para canjear';
        btn.disabled=false;btn.className='reward-ready';btn.textContent='MOSTRAR QR';
        btn.onclick=()=>{if(typeof w.go==='function')w.go('qr')};
      }else{
        badge.className='reward-availability no';badge.textContent=`Te faltan ${falta} puntos`;
        btn.disabled=true;btn.className='reward-locked';btn.textContent=`FALTAN ${falta}`;
      }
    });
  }

  function fixMovementRenderer(){
    if(typeof w.renderMoves!=='function')return;
    w.renderMoves=function(target,items){
      const el=d.getElementById(target);if(!el)return;
      if(!items?.length){el.innerHTML='<div class="empty">Todavía no hay movimientos.</div>';return}
      el.innerHTML=items.map(m=>{
        const debito=m?.tipo==='debito'||Number(m?.pontos)<0;
        const valor=Math.abs(Number(m?.pontos||0));
        const icon=typeof w.moveIcon==='function'?w.moveIcon(m):'⭐';
        const title=typeof w.moveTitle==='function'?w.moveTitle(m):(debito?'Canje de recompensa':'Puntos acreditados');
        const date=typeof w.fmtDate==='function'?w.fmtDate(m.data,true):'';
        const safe=typeof w.esc==='function'?w.esc(title):String(title||'');
        return `<div class="move"><div class="icon">${icon}</div><div class="main"><b>${safe}</b><span>${date}</span></div><div class="amount ${debito?'minus':'plus'}">${debito?'-':'+'}${valor}</div></div>`;
      }).join('');
    };
    if(typeof w.loadMoves==='function')w.loadMoves();
  }

  function showGoogleStatus(){
    if(!clientState)return;
    const benefits=d.getElementById('offersList');
    const benefitsTab=d.querySelector('[data-offer-tab="benefits"]')?.classList.contains('active');
    if(!benefits||!benefitsTab)return;
    if(clientState.google_review_clicked===true&&!benefits.querySelector('[data-google-complete]')){
      benefits.insertAdjacentHTML('beforeend','<div class="benefit benefit-complete" data-google-complete="1"><div class="benefit-head"><div class="benefit-icon">✓</div><div class="benefit-main"><h3>Google Review</h3><p>Gracias. Ya utilizaste la invitación para evaluar Uai Sô en Google.</p></div></div></div>');
    }
  }

  function scheduleSync(){
    clearTimeout(syncTimer);
    syncTimer=setTimeout(()=>{rerenderPromos();enhancePromos();enhanceRewards();showGoogleStatus()},80);
  }

  d.querySelectorAll('[data-offer-tab]').forEach(btn=>{
    btn.addEventListener('click',()=>setTimeout(()=>{rerenderPromos();enhancePromos();showGoogleStatus()},0));
  });
  d.querySelector('[data-tab="rewards"]')?.addEventListener('click',async()=>{
    await getClient();
    setTimeout(enhanceRewards,80);
  });

  const obs=new MutationObserver(()=>{
    if(!syncing)scheduleSync();
  });
  obs.observe(d.body,{childList:true,subtree:true});

  Promise.all([getPromos(),getClient()]).then(()=>{
    fixMovementRenderer();
    rerenderPromos();enhancePromos();enhanceRewards();showGoogleStatus();
    setInterval(async()=>{
      await Promise.all([getPromos(),getClient()]);
      rerenderPromos();enhancePromos();enhanceRewards();showGoogleStatus();
    },15000);
  });
});
</script>
</body>
</html>
