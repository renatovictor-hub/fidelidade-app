<!doctype html>
<!-- consolidated-audit-20261002 -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6a0dad">
<title>Fidelidad</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f5f9}iframe{display:block;width:100%;height:100%;border:0;background:#f7f5f9}</style>
<link rel="stylesheet" href="/client-readability.css?v=20260927-1">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="/client-push-sync.js?v=20261006-multirest3" defer></script>
</head>
<body>
<iframe id="app" title="Fidelidad"></iframe>
<script>
const params=new URLSearchParams(location.search);
let publicConfig=null,hasDelivery=false;
const frame=document.getElementById('app');

async function bootstrapRestaurant(){
  try{
    const r=await fetch('/api/cliente?action=public_config&t='+Date.now(),{cache:'no-store'});
    if(r.ok)publicConfig=await r.json();
  }catch(_){}
  publicConfig=publicConfig||{name:'Restaurante',short_name:'Restaurante',primary_color:'#6a0dad',accent_color:'#ffcc00',modules:{loyalty:true,delivery:false}};
  hasDelivery=publicConfig?.modules?.delivery===true;
  document.title=(publicConfig.short_name||publicConfig.name||'Fidelidad')+' Fidelidad';
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content',publicConfig.primary_color||'#6a0dad');
  frame.title=(publicConfig.short_name||publicConfig.name||'Restaurante')+' Fidelidad';
  const src=new URL('/app-v11.html',location.origin);
  for(const[k,v]of params)if(k!=='plan')src.searchParams.set(k,v);
  src.searchParams.set('plan',hasDelivery?'fidelity_delivery':'fidelity');
  src.hash=location.hash||'#home';
  frame.src=src.toString();
}
bootstrapRestaurant();

frame.addEventListener('load',()=>{
  const w=frame.contentWindow,d=frame.contentDocument;
  if(!w||!d)return;
  w.__restaurantConfig=publicConfig||{};
  d.documentElement.dataset.plan=hasDelivery?'fidelity_delivery':'fidelity';
  if(publicConfig){
    const primary=publicConfig.primary_color||'#6a0dad',accent=publicConfig.accent_color||'#ffcc00';
    d.documentElement.style.setProperty('--roxo',primary);
    d.documentElement.style.setProperty('--amarelo',accent);
    d.documentElement.style.setProperty('--p',primary);
    d.documentElement.style.setProperty('--p2',accent);
  }

  const style=d.createElement('style');
  style.textContent=`
  .offer-wa{width:100%;margin-top:10px;border:0;border-radius:11px;padding:11px 12px;background:#25d366;color:#fff;font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}
  .offer-countdown{display:inline-flex;margin:8px 0 0;padding:6px 8px;border-radius:9px;background:#f5effa;color:#6a0dad;font-size:9px;font-weight:800}
  .offer.expired .offer-countdown,.offer.expired .offer-wa{display:none!important}
  .offer img.v11-promo-img{height:0!important;opacity:0;background:transparent!important;transition:none!important}
  .offer img.v11-promo-img.is-loaded{height:150px!important;opacity:1}
  .benefit-complete{background:#f6f3f7!important;border-color:#e5dfe8!important}
  .reward{position:relative;flex-wrap:wrap}.reward .body{padding-right:4px}
  .reward-availability{display:inline-block;margin-top:6px;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:900}
  .reward-availability.ok{background:#e8f7ee;color:#198754}.reward-availability.no{background:#f1eff2;color:#756d79}
  .reward button.reward-ready{background:#6a0dad!important;color:#fff!important}.reward button.reward-locked{background:#ece8ef!important;color:#817887!important;cursor:not-allowed!important}
  .qr-close-v11{position:absolute;top:14px;right:14px;width:38px;height:38px;border:0;border-radius:50%;background:#fff;color:#6a0dad;font-size:22px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.13);z-index:20;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .screen#screen-qr{position:relative}.profile-points-note{font-size:10px;color:#777;margin-top:3px;line-height:1.3}
  .nav{position:relative}.nav-badge-v11{position:absolute;top:4px;right:18px;min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:#dc3545;color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .nav[data-tab="qr"] .nav-badge-v11{display:none}.nav-badge-v11.hidden{display:none}
  html[data-plan="fidelity"] [data-delivery-only],html[data-plan="fidelity"] #v11ActiveOrder,html[data-plan="fidelity"] #v11OrderHistory{display:none!important}
  html[data-plan="fidelity"] .quick{grid-template-columns:1fr!important}
  html[data-plan="fidelity"] .quick a[href="/menu-videos.html"]{display:none!important}
  .client-banner-carousel{position:relative;width:100%;overflow:hidden;border-radius:18px;box-shadow:var(--shadow);margin:0 0 18px;background:#eee}
  .client-banner-track{display:flex;width:100%;transition:transform .55s ease}
  .client-banner-slide{min-width:100%;width:100%;flex:0 0 100%}
  .client-banner-slide img{display:block;width:100%;height:180px;object-fit:cover}
  .client-banner-nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.9);color:#6a0dad;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.18);cursor:pointer;z-index:3}
  .client-banner-nav.prev{left:8px}.client-banner-nav.next{right:8px}
  .client-banner-nav:active{transform:translateY(-50%) scale(.96)}
  .client-banner-dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:5px;pointer-events:none}
  .client-banner-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .client-banner-dot.active{background:#fff;transform:scale(1.25)}`;
  d.head.appendChild(style);
  const menuLink=d.querySelector('.quick a[href="/menu-videos.html"]');
  if(menuLink)menuLink.setAttribute('data-delivery-only','1');
  if(!hasDelivery){
    const quick=d.querySelector('#screen-home .quick');
    if(quick&&quick.children.length===1)quick.style.display='none';
  }
  if(!d.getElementById('clientFidelityGrowthScript')){const gs=d.createElement('script');gs.id='clientFidelityGrowthScript';gs.src='/client-fidelity-growth.js?v=20261005-multirest2';d.body.appendChild(gs)}

  let promoCache=[],promosReady=false,clientState=null,lastTab='home',liveRefreshing=false,restaurantWhatsApp=String(publicConfig?.whatsapp||'').replace(/\D/g,'');
  const badImages=new Set();
  const nativeRenderOfferTab=typeof w.renderOfferTab==='function'?w.renderOfferTab.bind(w):null;
  const nativeLoadRewards=typeof w.loadRewards==='function'?w.loadRewards.bind(w):null;
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  async function getPublicConfig(){if(publicConfig?.whatsapp){restaurantWhatsApp=String(publicConfig.whatsapp).replace(/\D/g,'');return true}try{const r=await fetch('/api/cliente?action=public_config&t='+Date.now(),{cache:'no-store'});const d=await r.json();if(r.ok){publicConfig=d;if(d.whatsapp)restaurantWhatsApp=String(d.whatsapp).replace(/\D/g,'');return true}}catch(_){}return false}
  async function getPromos(){try{const uid=new URLSearchParams(location.search).get('uid')||'';if(!uid)return false;const r=await fetch('/api/cliente?action=app_data&uid='+encodeURIComponent(uid)+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Promotions unavailable');const raw=await r.json()||{};promoCache=Array.isArray(raw.promos)?raw.promos:[];promosReady=true;return true}catch(_){return false}}
  async function getClient(){try{const uid=new URLSearchParams(location.search).get('uid')||'';if(!uid)return;const r=await fetch('/api/cliente?uid='+encodeURIComponent(uid)+'&t='+Date.now(),{cache:'no-store'});if(r.ok)clientState=await r.json()}catch(_){}}

  let bannerTimer=null,bannerIndex=0;
  async function loadClientBanners(){
    const fallback=d.querySelector('#screen-home img.banner');
    if(!fallback)return;
    try{
      const r=await fetch('/api/client-banners?t='+Date.now(),{cache:'no-store'});
      const cfg=await r.json();
      const items=cfg?.enabled!==false&&Array.isArray(cfg?.items)?cfg.items:[];
      if(!items.length)return;
      let car=d.getElementById('clientBannerCarousel');
      if(!car){
        car=d.createElement('div');car.id='clientBannerCarousel';car.className='client-banner-carousel';
        fallback.insertAdjacentElement('beforebegin',car);fallback.remove();
      }
      car.innerHTML='<div class="client-banner-track">'+items.map(x=>'<div class="client-banner-slide"><img src="'+esc(x.image)+'" alt="'+esc(x.alt||'Banner')+'"></div>').join('')+'</div>'+(items.length>1?'<button type="button" class="client-banner-nav prev" aria-label="Banner anterior">‹</button><button type="button" class="client-banner-nav next" aria-label="Siguiente banner">›</button><div class="client-banner-dots">'+items.map((_,i)=>'<span class="client-banner-dot '+(i===0?'active':'')+'"></span>').join('')+'</div>':'');
      bannerIndex=0;
      const track=car.querySelector('.client-banner-track'),dots=[...car.querySelectorAll('.client-banner-dot')];
      const show=i=>{bannerIndex=(i+items.length)%items.length;track.style.transform='translateX(-'+(bannerIndex*100)+'%)';dots.forEach((x,j)=>x.classList.toggle('active',j===bannerIndex))};
      const interval=Math.max(3000,Math.min(15000,Number(cfg.interval_ms||5000)));
      const restart=()=>{clearInterval(bannerTimer);if(items.length>1)bannerTimer=setInterval(()=>show(bannerIndex+1),interval)};
      car.querySelector('.client-banner-nav.prev')?.addEventListener('click',()=>{show(bannerIndex-1);restart()});
      car.querySelector('.client-banner-nav.next')?.addEventListener('click',()=>{show(bannerIndex+1);restart()});
      clearInterval(bannerTimer);
      if(items.length>1)restart();
    }catch(e){console.warn('Client banners:',e)}
  }

  function setNavBadge(tab,count){const nav=d.querySelector(`.nav[data-tab="${tab}"]`);if(!nav)return;let b=nav.querySelector('.nav-badge-v11');if(!b){b=d.createElement('span');b.className='nav-badge-v11';nav.appendChild(b)}const n=Math.max(0,Number(count)||0);b.textContent=n>9?'9+':String(n);b.classList.toggle('hidden',n===0)}
  function titleOf(p){return String(p?.titulo||p?.title||p?.nome||'').trim()}
  function descOf(p){return String(p?.desc||p?.texto||p?.descricao||p?.descripcion||p?.mensagem||'').trim()}
  function imageOf(p){return String(p?.imagem||p?.image||p?.foto||'').trim()}
  function endOf(p){if(Number.isFinite(Number(p?.exp))&&Number(p.exp)>0)return Number(p.exp);return p?.fim||p?.fecha_fin||p?.expires_at||p?.validade||''}
  function endTs(p){const e=endOf(p),n=Number(e);if(Number.isFinite(n)&&n>0)return n<1e12?n*1000:n;const ts=new Date(e).getTime();return Number.isFinite(ts)?ts:NaN}
  function isActive(p){if(p?.ativa===false||p?.activo===false||p?.ativo===false||p?.active===false)return false;const ts=endTs(p);return Number.isFinite(ts)&&ts>Date.now()}
  function currentLists(){return{active:promoCache.filter(isActive).sort((a,b)=>(endTs(a)||Infinity)-(endTs(b)||Infinity)),expired:promoCache.filter(p=>!isActive(p)).sort((a,b)=>(endTs(b)||0)-(endTs(a)||0))}}
  function promoSignature(p){return [p.id,titleOf(p),descOf(p),imageOf(p),endOf(p),isActive(p)?1:0].join('|')}
  function listKey(kind,list){return kind+'::'+list.map(promoSignature).join('~~')}
  function formatLeft(p){const ts=endTs(p);if(!Number.isFinite(ts)||ts<=Date.now())return'';const diff=ts-Date.now(),h=Math.floor(diff/36e5),m=Math.floor(diff%36e5/6e4);return h>=24?`⏳ Termina en ${Math.floor(h/24)}d ${h%24}h`:`⏳ Termina en ${h}h ${m}min`}
  function promoHtml(p,expired=false){const img=imageOf(p),id=esc(p?.id||''),ts=endTs(p);const imgHtml=img&&!badImages.has(img)?`<img class="v11-promo-img" data-v11-img="1" src="${esc(img)}" alt="">`:'';return `<article class="offer ${expired?'expired':''}" data-promo-id="${id}">${imgHtml}<div class="body"><h3>${esc(titleOf(p)||'Promoción especial')}</h3><p>${esc(descOf(p))}</p><span class="tag">${expired?'FINALIZADA':'ACTIVA'}</span>${!expired&&Number.isFinite(ts)?`<div class="offer-countdown" data-exp="${ts}">${esc(formatLeft(p))}</div>`:''}${!expired?`<button class="offer-wa" type="button" data-promo-id="${id}">💬 PEDIR POR WHATSAPP</button>`:''}</div></article>`}
  function matchPromo(card){const id=card?.dataset?.promoId||'';if(id){const p=promoCache.find(x=>String(x.id)===String(id));if(p)return p}const t=card?.querySelector('h3')?.textContent.trim()||'';return promoCache.find(p=>titleOf(p)===t)||null}
  function openWhatsApp(p,card){const title=titleOf(p)||card?.querySelector('h3')?.textContent.trim()||'Promoción especial';w.open('https://api.whatsapp.com/send?phone='+restaurantWhatsApp+'&text='+encodeURIComponent(`Hola! Quiero la promo: ${title}`),'_blank','noopener')}
  function hydratePromos(scope){if(!scope)return;scope.querySelectorAll('img[data-v11-img]').forEach(img=>{const ok=()=>{if(img.isConnected&&img.naturalWidth>0)img.classList.add('is-loaded')};const fail=()=>{badImages.add(img.getAttribute('src')||'');img.remove()};if(img.complete){img.naturalWidth>0?ok():fail()}else{img.addEventListener('load',ok,{once:true});img.addEventListener('error',fail,{once:true})}});scope.querySelectorAll('.offer-wa').forEach(btn=>{btn.onclick=()=>{const card=btn.closest('.offer');openWhatsApp(matchPromo(card),card)}})}
  function renderStable(el,html,key){if(!el)return false;if(el.dataset.v11RenderKey===key)return false;el.innerHTML=html;el.dataset.v11RenderKey=key;hydratePromos(el);return true}
  function renderOffersTab(active,expired){const el=d.getElementById('offersList');if(!el)return;const activeTab=d.querySelector('[data-offer-tab="active"]')?.classList.contains('active');const previousTab=d.querySelector('[data-offer-tab="previous"]')?.classList.contains('active');const benefitsTab=d.querySelector('[data-offer-tab="benefits"]')?.classList.contains('active');if(activeTab){const html=active.length?active.map(x=>promoHtml(x)).join(''):'<div class="empty">No hay promociones activas ahora.</div>';renderStable(el,html,listKey('active',active));return}if(previousTab){const list=expired.slice(0,3);const html=list.length?list.map(x=>promoHtml(x,true)).join(''):'<div class="empty">Todavía no hay promociones anteriores.</div>';renderStable(el,html,listKey('previous',list));return}if(benefitsTab&&nativeRenderOfferTab){el.dataset.v11RenderKey='';nativeRenderOfferTab()}}
  function renderPromoAreas(force=false){const{active,expired}=currentLists();setNavBadge('offers',active.length);const home=d.getElementById('homeOffers'),prevBlock=d.getElementById('previousBlock'),homePrev=d.getElementById('homePrevious');if(force&&home)home.dataset.v11RenderKey='';if(force&&homePrev)homePrev.dataset.v11RenderKey='';if(home){const list=active.slice(0,2),html=list.length?list.map(x=>promoHtml(x)).join(''):'<div class="empty">No hay promociones activas ahora.</div>';renderStable(home,html,listKey('home-active',list))}if(prevBlock&&homePrev){prevBlock.style.display=expired.length?'block':'none';const list=expired.slice(0,3);renderStable(homePrev,list.map(x=>promoHtml(x,true)).join(''),listKey('home-previous',list))}renderOffersTab(active,expired)}
  function updateCountdowns(){d.querySelectorAll('.offer-countdown[data-exp]').forEach(el=>{const ts=Number(el.dataset.exp||0);if(!ts)return;const diff=ts-Date.now();if(diff<=0){refreshLive();return}const h=Math.floor(diff/36e5),m=Math.floor(diff%36e5/6e4),txt=h>=24?`⏳ Termina en ${Math.floor(h/24)}d ${h%24}h`:`⏳ Termina en ${h}h ${m}min`;if(el.textContent!==txt)el.textContent=txt})}
  function enhanceRewards(){const saldo=Math.max(0,Number(clientState?.pontos||0));let disponibles=0;d.querySelectorAll('#rewardsList .reward').forEach(card=>{const rawCost=card.dataset.points??String(card.querySelector('.pts')?.textContent||'').replace(/\D/g,''),custo=Math.max(0,Number(rawCost)||0),body=card.querySelector('.body'),btn=card.querySelector('button');if(!body||!btn||!rawCost)return;const falta=Math.max(0,custo-saldo);let badge=body.querySelector('.reward-availability');if(!badge){badge=d.createElement('div');badge.className='reward-availability';body.appendChild(badge)}btn.onclick=null;btn.removeAttribute('onclick');if(!falta){disponibles++;badge.className='reward-availability ok';badge.textContent='✓ Disponible para canjear';btn.disabled=false;btn.className='reward-ready';btn.textContent='MOSTRAR QR';btn.onclick=()=>{lastTab='rewards';if(typeof w.go==='function')w.go('qr');addQrClose()}}else{badge.className='reward-availability no';badge.textContent=`Te faltan ${falta} puntos`;btn.disabled=true;btn.className='reward-locked';btn.textContent=`FALTAN ${falta}`}});setNavBadge('rewards',disponibles)}
  if(nativeLoadRewards){w.loadRewards=async function(){const result=await nativeLoadRewards();enhanceRewards();return result}}
  function addQrClose(){const qr=d.getElementById('screen-qr');if(!qr||qr.querySelector('.qr-close-v11'))return;const b=d.createElement('button');b.className='qr-close-v11';b.type='button';b.setAttribute('aria-label','Cerrar QR');b.innerHTML='×';b.onclick=()=>{if(typeof w.go==='function')w.go(lastTab||'home')};qr.appendChild(b)}
  function enhanceProfile(){if(!clientState)return;const stats=d.querySelector('#screen-profile .stats');if(stats){const first=stats.querySelector('.stat span');if(first)first.textContent='Disponibles'}const dataCard=[...d.querySelectorAll('#screen-profile .card')].find(x=>x.querySelector('h3')?.textContent.trim()==='Mis datos');if(dataCard){let row=dataCard.querySelector('[data-accumulated-row]');if(!row){row=d.createElement('div');row.className='data-row';row.setAttribute('data-accumulated-row','1');const version=[...dataCard.querySelectorAll('.data-row')].find(x=>x.textContent.includes('Versión'));if(version)dataCard.insertBefore(row,version);else dataCard.appendChild(row)}row.innerHTML=`<span>⭐ Puntos acumulados</span><b>${Math.max(0,Number(clientState.pontos_acumulados||clientState.pontos||0))}</b>`}const progress=d.getElementById('profileProgressTxt');if(progress&&!progress.parentElement.querySelector('.profile-points-note')){const note=d.createElement('div');note.className='profile-points-note';note.textContent='El nivel se calcula con tus puntos acumulados; los puntos disponibles pueden bajar cuando canjeas recompensas.';progress.insertAdjacentElement('afterend',note)}}
  function fixMovementRenderer(){if(typeof w.renderMoves!=='function')return;w.renderMoves=function(target,items){const el=d.getElementById(target);if(!el)return;if(!items?.length){el.innerHTML='<div class="empty">Todavía no hay movimientos.</div>';return}el.innerHTML=items.map(m=>{const deb=m?.tipo==='debito'||Number(m?.pontos)<0,v=Math.abs(Number(m?.pontos||0)),icon=typeof w.moveIcon==='function'?w.moveIcon(m):'⭐',title=typeof w.moveTitle==='function'?w.moveTitle(m):(deb?'Canje de recompensa':'Puntos acreditados'),date=typeof w.fmtDate==='function'?w.fmtDate(m.data,true):'',safe=typeof w.esc==='function'?w.esc(title):esc(title);return `<div class="move"><div class="icon">${icon}</div><div class="main"><b>${safe}</b><span>${date}</span></div><div class="amount ${deb?'minus':'plus'}">${deb?'-':'+'}${v}</div></div>`}).join('')};if(typeof w.loadMoves==='function')w.loadMoves()}
  function showGoogleStatus(){if(!clientState)return;const benefits=d.getElementById('offersList'),tab=d.querySelector('[data-offer-tab="benefits"]')?.classList.contains('active');if(!benefits||!tab)return;if(clientState.google_review_clicked===true&&!benefits.querySelector('[data-google-complete]'))benefits.insertAdjacentHTML('beforeend','<div class="benefit benefit-complete" data-google-complete="1"><div class="benefit-head"><div class="benefit-icon">✓</div><div class="benefit-main"><h3>Google Review</h3><p>Gracias. Ya utilizaste la invitación para evaluar este restaurante en Google.</p></div></div></div>')}
  async function refreshLive(){if(liveRefreshing)return;liveRefreshing=true;try{const[promosUpdated]=await Promise.all([getPromos(),getClient()]);if(typeof w.loadClient==='function')await w.loadClient();await Promise.all([typeof w.loadMoves==='function'?w.loadMoves():null,typeof w.loadVip==='function'?w.loadVip():null,typeof w.loadBonus==='function'?w.loadBonus():null,typeof w.loadBirthday==='function'?w.loadBirthday():null]);if(promosUpdated||promosReady)renderPromoAreas(false);enhanceRewards();enhanceProfile();showGoogleStatus();updateCountdowns()}catch(e){console.warn('Live refresh v1.1:',e)}finally{liveRefreshing=false}}
  if(typeof w.renderOfferTab==='function'){w.renderOfferTab=function(){const{active,expired}=currentLists();setNavBadge('offers',active.length);renderOffersTab(active,expired);showGoogleStatus();updateCountdowns()}}
  d.querySelector('[data-tab="rewards"]')?.addEventListener('click',async()=>{lastTab='rewards';await refreshLive();if(typeof w.loadRewards==='function')await w.loadRewards();else enhanceRewards()});
  d.querySelector('[data-tab="profile"]')?.addEventListener('click',async()=>{lastTab='profile';await refreshLive();setTimeout(enhanceProfile,50)});
  d.querySelectorAll('.nav').forEach(btn=>btn.addEventListener('click',()=>{if(btn.dataset.tab&&btn.dataset.tab!=='qr')lastTab=btn.dataset.tab}));
  w.addEventListener('focus',refreshLive);w.addEventListener('pageshow',refreshLive);d.addEventListener('visibilitychange',()=>{if(d.visibilityState==='visible')refreshLive()});
  Promise.all([getPublicConfig(),getPromos(),getClient(),loadClientBanners()]).then(()=>{fixMovementRenderer();if(promosReady)renderPromoAreas(true);enhanceRewards();addQrClose();enhanceProfile();showGoogleStatus();updateCountdowns();setTimeout(()=>{if(promosReady)renderPromoAreas(false)},700);setInterval(refreshLive,15000);setInterval(updateCountdowns,30000)});
});
</script>
<script>
if(hasDelivery){
  const s=document.createElement('script');
  s.src='/order-status-client.js?v=20261002-consolidation1';
  document.body.appendChild(s);
}
</script>
<script src="/tenant-runtime.js?v=20261005-1"></script>
</body>
