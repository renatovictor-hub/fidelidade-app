<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preparando prueba - Uai Sô</title>
<style>body{font-family:Segoe UI,Roboto,sans-serif;background:#f7f7fb;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;color:#6a0dad}.box{text-align:center;padding:28px}.spinner{width:34px;height:34px;border:4px solid #eadcff;border-top-color:#6a0dad;border-radius:50%;margin:0 auto 15px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="box"><div class="spinner"></div><b>Preparando tu app de prueba...</b></div>
<script>
(async()=>{
  const params=new URLSearchParams(location.search);
  const uid=params.get('uid')||'';
  if(!/^user_\d+$/.test(uid)){
    document.querySelector('.box').innerHTML='<b>UID de prueba inválido.</b>';
    return;
  }
  try{
    const r=await fetch(`/api/cliente?uid=${encodeURIComponent(uid)}&t=${Date.now()}`,{cache:'no-store'});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Cliente no encontrado');
    localStorage.setItem('uid',uid);
    localStorage.setItem('nome',d.nome||d.nombre||'Cliente');
    if(d.telefone) localStorage.setItem('telefone',String(d.telefone));
    localStorage.setItem('push','true');
    location.replace('/');
  }catch(e){
    document.querySelector('.box').innerHTML='<b>No se pudo preparar la cuenta de prueba.</b><br><small>'+String(e.message||e)+'</small>';
  }
})();
</script>
</body>
</html>
