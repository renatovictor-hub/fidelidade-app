<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6a0dad">
<title>Preview Uai Sô Fidelidad v1.1</title>
<style>
:root{--p:#6a0dad;--bg:#f7f5f9;--text:#2e2932;--muted:#817789}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
body{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(100%,430px);background:#fff;border:1px solid #e9e1ed;border-radius:22px;padding:22px;box-shadow:0 14px 35px rgba(61,22,82,.10)}
.logo{display:block;width:92px;margin:0 auto 12px}.tag{display:inline-flex;padding:5px 9px;border-radius:999px;background:#efe3f7;color:var(--p);font-size:10px;font-weight:900}.title{margin:10px 0 5px;color:var(--p);font-size:22px}.copy{margin:0 0 17px;color:var(--muted);font-size:13px;line-height:1.45}.field{display:grid;gap:6px}.field span{font-size:12px;font-weight:800}.field input{width:100%;height:50px;border:1px solid #ded3e2;border-radius:13px;padding:0 14px;font:inherit;font-size:16px;outline:none}.field input:focus{border-color:#9b45df;box-shadow:0 0 0 3px rgba(106,13,173,.10)}button{width:100%;height:50px;margin-top:12px;border:0;border-radius:13px;background:var(--p);color:#fff;font:inherit;font-weight:900;cursor:pointer}button:disabled{opacity:.55}.msg{min-height:20px;margin-top:10px;font-size:12px;color:#a31e36}.note{margin-top:12px;padding:10px 12px;border-radius:12px;background:#f6f0f8;color:#706477;font-size:11px;line-height:1.4}
</style>
</head>
<body>
<main class="card">
  <img src="/logo.png" class="logo" alt="Uai Sô">
  <span class="tag">PREVIEW v1.1</span>
  <h1 class="title">Abrir o app de teste</h1>
  <p class="copy">Este acesso ignora a tela de instalação. Digite o telefone de um cliente já cadastrado para abrir diretamente a versão v1.1.</p>
  <form id="form">
    <label class="field"><span>Telefone do cliente</span><input id="phone" inputmode="numeric" autocomplete="tel" maxlength="16" placeholder="998 000 0000" required></label>
    <button id="btn" type="submit">ABRIR PREVIEW</button>
    <div id="msg" class="msg"></div>
  </form>
  <div class="note">Não instala nada e não altera a produção. Serve apenas para testar a branch v1.1 com os dados reais do cliente selecionado.</div>
</main>
<script>
const form=document.getElementById('form'),phone=document.getElementById('phone'),btn=document.getElementById('btn'),msg=document.getElementById('msg');
form.addEventListener('submit',async e=>{
  e.preventDefault();msg.textContent='';const digits=phone.value.replace(/\D/g,'');if(digits.length!==10){msg.textContent='Digite os 10 dígitos do telefone.';return}
  btn.disabled=true;btn.textContent='BUSCANDO...';
  try{
    const r=await fetch('/api/verificar-telefone?telefone='+encodeURIComponent(digits)+'&t='+Date.now(),{cache:'no-store'}),d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||'Não foi possível localizar o cliente.');
    if(!d.existe||!/^user_\d+$/.test(String(d.uid||'')))throw new Error('Cliente não encontrado.');
    location.href='/app-v11-next.html?uid='+encodeURIComponent(d.uid)+'#home';
  }catch(err){msg.textContent=err.message||'Erro ao abrir o preview.';btn.disabled=false;btn.textContent='ABRIR PREVIEW';}
});
</script>
</body>
</html>
