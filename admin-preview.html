<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurante Admin Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f5f2f7}
#previewLoader{position:fixed;inset:0;display:grid;place-items:center;background:#f5f2f7;color:#6b7280;font:700 14px system-ui;z-index:2}
#previewLoader div{text-align:center}
#previewLoader span{display:block;width:28px;height:28px;border:3px solid #dccbe7;border-top-color:#6b7280;border-radius:50%;margin:0 auto 10px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
iframe{display:block;width:100%;height:100%;border:0;background:#f5f2f7;opacity:0;transition:opacity .12s ease}
body.ready iframe{opacity:1}
body.ready #previewLoader{display:none}
</style>
<script src="/admin-module-loader.js?v=20261005-1"></script>
</head>
<body>
<div id="previewLoader"><div><span></span>Cargando panel…</div></div>
<iframe id="dashboardFrame" title="Dashboard Restaurante"></iframe>
<script>
const companyParam=String(new URLSearchParams(location.search).get('company')||'').trim();
const companyQuery=companyParam?'&company='+encodeURIComponent(companyParam):'';
const tenantConfigPromise=fetch('/api/cliente?action=public_config&t='+Date.now()+companyQuery,{cache:'no-store'}).then(r=>r.ok?r.json():null).then(cfg=>{
  if(!cfg)return;
  const name=cfg.short_name||cfg.name||'Restaurante';
  document.title=name+' Admin Preview';
  document.documentElement.style.setProperty('--roxo',cfg.primary_color||'#6b7280');
  const f=document.getElementById('dashboardFrame');if(f)f.title='Dashboard '+name;
}).catch(()=>{});
const frame=document.getElementById('dashboardFrame');
fetch('/api/admin-auth',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action:'preview_login',company:companyParam||'uai-so'})})
  .then(async r=>{if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'No se pudo iniciar la sesión de Preview');frame.src='/dashboard.html?v=20260927-crm1'+(companyParam?'&company='+encodeURIComponent(companyParam):'');})
  .catch(e=>{const loader=document.getElementById('previewLoader');if(loader)loader.innerHTML='<div>'+String(e.message||e)+'</div>';});
function waitForNewDashboard(d,attempt=0){
  const ok=d.getElementById('uxOverviewV4') &&
           d.getElementById('uxSidebar') &&
           d.body.classList.contains('ux3');
  if(ok) return Promise.resolve();
  if(attempt>40) return Promise.reject(new Error('La interfaz nueva no terminó de iniciar.'));
  return new Promise(r=>setTimeout(r,75)).then(()=>waitForNewDashboard(d,attempt+1));
}

frame.addEventListener('load',async()=>{
  const d=frame.contentDocument;
  if(!d)return;
  try{
    const cfg=await tenantConfigPromise.catch(()=>null);
    if(cfg){
      const name=cfg.short_name||cfg.name||'Restaurante',primary=cfg.primary_color||'#6b7280',accent=cfg.accent_color||primary;
      d.defaultView.__restaurantConfig=cfg;
      d.documentElement.style.setProperty('--roxo',primary);
      d.documentElement.style.setProperty('--amarelo',accent);
      d.documentElement.style.setProperty('--tenant-primary',primary);
      d.documentElement.style.setProperty('--tenant-accent',accent);
      d.documentElement.style.setProperty('--ux-purple',primary);
      d.documentElement.style.setProperty('--ux-purple2',accent);
      d.documentElement.style.setProperty('--ux-yellow',accent);
      d.title='Dashboard '+name+' - Gestión';
    }
    await window.loadRestaurantAdminModules(d);
    await waitForNewDashboard(d);
    if(cfg){
      const name=cfg.short_name||cfg.name||'Restaurante';
      const brand=d.querySelector('#uxSidebar .ux-brand strong');if(brand)brand.textContent=name;
      const company=d.querySelector('#uxSidebar .ux-company-top b');if(company)company.textContent=cfg.name||name;
      const img=d.querySelector('#uxSidebar .ux-brand img');if(img){if(cfg.logo){img.src=cfg.logo;img.style.removeProperty('display')}else{img.removeAttribute('src');img.style.display='none'}img.alt=name;}
    }
    document.body.classList.add('ready');
  }catch(e){
    console.error(e);
    const loader=document.getElementById('previewLoader');
    if(loader)loader.innerHTML='<div>No se pudo cargar el panel.<br><small>Recarga la página.</small></div>';
  }
});
</script>
<script src="/tenant-runtime.js?v=20261005-1"></script>
</body>
</html>
