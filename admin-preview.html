<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uai Sô Admin Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f5f2f7}
#previewLoader{position:fixed;inset:0;display:grid;place-items:center;background:#f5f2f7;color:#6a0dad;font:700 14px system-ui;z-index:2}
#previewLoader div{text-align:center}
#previewLoader span{display:block;width:28px;height:28px;border:3px solid #dccbe7;border-top-color:#6a0dad;border-radius:50%;margin:0 auto 10px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
iframe{display:block;width:100%;height:100%;border:0;background:#f5f2f7;opacity:0;transition:opacity .12s ease}
body.ready iframe{opacity:1}
body.ready #previewLoader{display:none}
</style>
</head>
<body>
<div id="previewLoader"><div><span></span>Cargando panel…</div></div>
<iframe id="dashboardFrame" src="/dashboard.html?v=20260927-crm1" title="Dashboard Uai Sô"></iframe>
<script>
const frame=document.getElementById('dashboardFrame');
const scripts=[
  ['/recompensas-admin.js?v=20260825-2','recompensasAdminScript'],
  ['/notificacoes-admin.js?v=20260927-uxboards1','notificacoesAdminScript'],
  ['/cumpleanos-admin.js?v=20260826-1','cumpleanosAdminScript'],
  ['/bonus-pontos-admin.js?v=20260831-1','bonusPontosAdminScript'],
  ['/referidos-admin.js?v=20260831-1','referidosAdminScript'],
  ['/niveles-vip-admin.js?v=20260831-1','nivelesVipAdminScript'],
  ['/reviews-admin.js?v=20260927-reorg1','reviewsAdminScript'],
  ['/reviews-dashboard-v2.js?v=20260928-4','reviewsDashboardV2Script'],
  ['/pedidos-admin.js?v=20260913-2','pedidosAdminScript'],
  ['/dashboard-ux-v2.js?v=20260928-loyalty1','dashboardUxV2Script'],
  ['/dashboard-navigation-v3.js?v=20260928-persist1','dashboardNavigationV3Script'],
  ['/dashboard-overview-v4.js?v=20260927-crm2','dashboardOverviewV4Script'],
  ['/dashboard-core-modules-v5.js?v=20260928-persist1','dashboardCoreModulesV5Script'],
  ['/dashboard-growth-modules-v6.js?v=20260927-uxboards1','dashboardGrowthModulesV6Script'],
  ['/dashboard-final-modules-v7.js?v=20260928-persist1','dashboardFinalModulesV7Script']
];

function loadScriptSequentially(d,index=0){
  if(index>=scripts.length) return Promise.resolve();
  const [src,id]=scripts[index];
  if(d.getElementById(id)) return loadScriptSequentially(d,index+1);
  return new Promise((resolve,reject)=>{
    const s=d.createElement('script');
    s.id=id;
    s.src=src;
    s.async=false;
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error('No se pudo cargar '+src));
    d.body.appendChild(s);
  }).then(()=>loadScriptSequentially(d,index+1));
}

function waitForNewDashboard(d,attempt=0){
  const ok=d.getElementById('uxOverviewV4') &&
           d.getElementById('uxSidebar') &&
           d.body.classList.contains('ux3');
  if(ok) return Promise.resolve();
  if(attempt>40) return Promise.reject(new Error('La interfaz nueva no terminó de iniciar.'));
  return new Promise(r=>setTimeout(r,75)).then(()=>waitForNewDashboard(d,attempt+1));
}

frame.addEventListener('load',async()=>{
  const d=frame.contentDocument;
  if(!d)return;
  try{
    await loadScriptSequentially(d);
    await waitForNewDashboard(d);
    document.body.classList.add('ready');
  }catch(e){
    console.error(e);
    const loader=document.getElementById('previewLoader');
    if(loader)loader.innerHTML='<div>No se pudo cargar el panel.<br><small>Recarga la página.</small></div>';
  }
});
</script>
</body>
</html>
