<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Menú en video · Uai Sô</title>
<style>
:root{--purple:#6a0dad;--purple2:#9b30ff;--yellow:#ffc400;--ink:#fff;--panel:#fff;--text:#261d2b;--muted:#796f7e;--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#130018;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}button{font:inherit}.app{position:relative;width:min(100%,520px);height:100dvh;margin:auto;background:#130018;overflow:hidden}
.topbar{position:absolute;z-index:20;top:0;left:0;right:0;padding:calc(10px + var(--safe-top)) 12px 12px;background:linear-gradient(180deg,rgba(10,0,14,.92),rgba(10,0,14,.62) 72%,transparent)}.topline{display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;border:1px solid rgba(255,255,255,.28);border-radius:50%;background:rgba(20,7,25,.5);backdrop-filter:blur(12px);color:#fff;display:grid;place-items:center;font-size:20px;cursor:pointer}.brand{min-width:0;flex:1}.brand b{display:block;font-size:16px}.brand span{display:block;font-size:10px;color:rgba(255,255,255,.76)}.cart-btn{position:relative}.cart-count{position:absolute;right:-3px;top:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:#ff3154;border:2px solid #fff;display:grid;place-items:center;font-size:9px;font-weight:900}.cart-count.hidden{display:none}
.view-switch{width:226px;margin:10px auto 0;padding:3px;display:grid;grid-template-columns:1fr 1fr;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:rgba(22,4,28,.64);backdrop-filter:blur(12px)}.view-switch button{height:34px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.72);font-size:12px;font-weight:900;cursor:pointer}.view-switch button.active{background:#fff;color:var(--purple);box-shadow:0 3px 10px rgba(0,0,0,.18)}
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none}.feed.hidden{display:none}.feed::-webkit-scrollbar{display:none}.dish{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#2b1033}.dish video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#2a0a34}.dish::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,0,15,.2) 25%,rgba(13,0,17,.25) 48%,rgba(12,0,15,.93) 100%);pointer-events:none}.demo{position:absolute;z-index:3;top:calc(118px + var(--safe-top));left:14px;padding:6px 9px;border-radius:999px;background:rgba(255,196,0,.92);color:#2c1b00;font-size:9px;font-weight:900;letter-spacing:.05em}.sound{position:absolute;z-index:4;right:14px;top:calc(120px + var(--safe-top));width:39px;height:39px;border:0;border-radius:50%;background:rgba(12,0,16,.55);color:#fff;font-size:17px;backdrop-filter:blur(10px)}
.content{position:absolute;z-index:4;left:0;right:0;bottom:0;padding:24px 16px calc(24px + var(--safe-bottom));display:grid;gap:12px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.12em;color:#ffd84f}.dish h1{font-size:31px;line-height:1.02;margin:0;max-width:88%;text-shadow:0 2px 12px rgba(0,0,0,.35)}.desc{font-size:14px;line-height:1.38;color:rgba(255,255,255,.84);margin:0;max-width:92%}.meta{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);font-size:10px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1.35fr;gap:9px}.actions button{min-height:49px;border-radius:14px;font-weight:900;font-size:12px;cursor:pointer}.details{border:1px solid rgba(255,255,255,.55);background:rgba(22,4,28,.32);color:#fff;backdrop-filter:blur(10px)}.order{border:0;background:linear-gradient(135deg,var(--purple2),var(--purple));color:#fff;box-shadow:0 9px 22px rgba(106,13,173,.38)}
.pager{position:absolute;z-index:7;right:10px;top:50%;transform:translateY(-50%);display:grid;gap:6px}.dot{width:4px;height:17px;border-radius:999px;background:rgba(255,255,255,.35);transition:.2s}.dot.active{height:30px;background:#fff}
.pager.hidden{display:none}.catalog{height:100%;overflow-y:auto;background:#f7f4f8;color:var(--text);padding:calc(132px + var(--safe-top)) 14px calc(28px + var(--safe-bottom));scrollbar-width:none}.catalog.hidden{display:none}.catalog::-webkit-scrollbar{display:none}.catalog-intro{padding:9px 2px 14px}.catalog-intro h1{margin:0 0 5px;font-size:27px;color:#32113e}.catalog-intro p{margin:0;color:var(--muted);font-size:14px}.search{position:relative;display:block;margin-bottom:13px}.search input{width:100%;height:48px;border:1px solid #e5dbe9;border-radius:15px;background:#fff;padding:0 15px 0 46px;color:var(--text);font:inherit;font-size:15px;outline:none}.search input:focus{border-color:#a957dc;box-shadow:0 0 0 3px rgba(155,48,255,.12)}.search svg{position:absolute;z-index:2;left:16px;top:50%;width:19px;height:19px;transform:translateY(-50%);color:#5d5262;pointer-events:none}.categories{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 18px;padding:0 14px;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}.categories button{white-space:nowrap;min-height:37px;border:1px solid #dfd2e5;border-radius:999px;background:#fff;color:#684b71;padding:0 14px;font-size:12px;font-weight:900}.categories button.active{border-color:var(--purple);background:var(--purple);color:#fff}.product-list{display:grid;gap:12px}.product-card{display:grid;grid-template-columns:112px 1fr;min-height:142px;overflow:hidden;border:1px solid #eadfed;border-radius:19px;background:#fff;box-shadow:0 8px 24px rgba(46,18,58,.07)}.product-media{position:relative;overflow:hidden;border:0;padding:0;background:#2a0a34;color:#fff;cursor:pointer}.product-media video{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}.product-media::after{content:"▶";position:absolute;left:50%;top:50%;width:38px;height:38px;display:grid;place-items:center;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.65);border-radius:50%;background:rgba(20,2,27,.56);font-size:14px;backdrop-filter:blur(6px)}.product-media span{position:absolute;z-index:2;left:50%;bottom:7px;transform:translateX(-50%);white-space:nowrap;padding:4px 7px;border-radius:999px;background:rgba(20,2,27,.72);color:#fff;font-size:8px;font-weight:900}.product-body{min-width:0;padding:13px 12px;display:flex;flex-direction:column}.product-body small{color:var(--purple);font-size:9px;font-weight:900;letter-spacing:.05em}.product-body h2{margin:5px 0 4px;font-size:16px;line-height:1.15}.product-body p{display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin:0;color:var(--muted);font-size:12px;line-height:1.35}.product-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}.product-price{font-size:14px;font-weight:950;color:#32113e}.add-small{width:36px;height:36px;border:0;border-radius:11px;background:var(--purple);color:#fff;font-size:22px;font-weight:800;line-height:1}.empty-search{padding:42px 16px;text-align:center;color:var(--muted)}
.sheet-wrap{display:none;position:absolute;z-index:50;inset:0;background:rgba(13,3,17,.58);align-items:flex-end}.sheet-wrap.open{display:flex}.sheet{width:100%;max-height:92dvh;overflow:auto;background:var(--panel);color:var(--text);border-radius:25px 25px 0 0;padding:10px 17px calc(18px + var(--safe-bottom));box-shadow:0 -18px 45px rgba(0,0,0,.28)}.handle{width:43px;height:4px;border-radius:999px;background:#d8d1dc;margin:2px auto 14px}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.sheet-head h2{margin:0;color:var(--purple);font-size:22px}.close{flex:0 0 auto;width:39px;height:39px;border:0;border-radius:50%;background:#f0eaf3;color:var(--purple);font-size:23px;cursor:pointer}.sheet-copy{color:var(--muted);font-size:14px;line-height:1.45}.ingredients{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}.ingredients span{padding:7px 9px;border-radius:9px;background:#f4eff7;color:#5e4d65;font-size:11px;font-weight:700}.option-block{padding:15px 0;border-top:1px solid #eee6f1}.option-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.option-title strong{font-size:15px}.option-title span{border-radius:999px;background:#f1e8f5;color:var(--purple);padding:5px 9px;font-size:11px;font-weight:900}.option-title span.complete{background:#e2f7ea;color:#15783b}.flavor-list{display:grid;gap:8px}.flavor-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 11px;border:1px solid #eadfed;border-radius:13px}.flavor-row b{display:block;font-size:13px}.flavor-row small{color:var(--muted);font-size:11px}.mini-qty{display:flex;align-items:center;gap:9px}.mini-qty button{width:31px;height:31px;border:0;border-radius:9px;background:#f0e8f4;color:var(--purple);font-size:18px;font-weight:900}.mini-qty button:disabled{opacity:.35}.mini-qty b{min-width:14px;text-align:center}.extras{display:grid;gap:8px}.extra{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid #eadfed;border-radius:13px;font-size:13px}.extra input{width:19px;height:19px;accent-color:var(--purple)}.extra span{margin-left:auto;color:var(--purple);font-weight:900}.notes{width:100%;min-height:72px;resize:vertical;border:1px solid #e3d9e7;border-radius:13px;padding:11px;font:inherit;font-size:13px;outline:none}.notes:focus{border-color:#a957dc;box-shadow:0 0 0 3px rgba(155,48,255,.12)}.price-line{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid #eee6f1;font-weight:900}.primary{width:100%;min-height:50px;border:0;border-radius:14px;background:var(--purple);color:#fff;font-weight:900}.primary:disabled{background:#cbbdd1;color:#746979}.prototype-note{margin-top:10px;padding:10px;border-radius:11px;background:#fff7d8;color:#705700;font-size:10px;line-height:1.35}
.video-wrap{display:none;position:absolute;z-index:80;inset:0;align-items:center;justify-content:center;padding:calc(16px + var(--safe-top)) 14px calc(16px + var(--safe-bottom));background:rgba(8,0,11,.9);backdrop-filter:blur(10px)}.video-wrap.open{display:flex}.video-modal{position:relative;width:min(100%,390px);max-height:94dvh;overflow:hidden;border-radius:22px;background:#17031e;box-shadow:0 24px 70px rgba(0,0,0,.52)}.video-modal video{display:block;width:100%;max-height:74dvh;aspect-ratio:9/14;object-fit:cover;background:#000}.video-close{position:absolute;z-index:2;right:11px;top:11px;width:42px;height:42px;border:1px solid rgba(255,255,255,.45);border-radius:50%;background:rgba(15,1,20,.68);color:#fff;font-size:25px;backdrop-filter:blur(8px)}.video-order{width:calc(100% - 24px);min-height:48px;margin:12px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--purple2),var(--purple));color:#fff;font-weight:900}.cart-list{display:grid;gap:9px;margin:14px 0}.cart-empty{text-align:center;padding:30px 12px;color:#8d8391}.cart-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:12px;border:1px solid #eee7f1;border-radius:14px}.cart-row b{display:block;font-size:13px}.cart-row small{display:block;color:var(--muted);line-height:1.35}.qty{display:flex;align-items:center;gap:10px}.qty button{width:31px;height:31px;border:0;border-radius:9px;background:#f0e8f4;color:var(--purple);font-size:18px;font-weight:900}.total{display:flex;justify-content:space-between;font-size:19px;font-weight:900;padding:14px 2px}.whatsapp{background:#25d366}.toast{position:absolute;z-index:90;left:50%;bottom:calc(22px + var(--safe-bottom));transform:translate(-50%,30px);opacity:0;background:#fff;color:#3d2848;border-radius:999px;padding:11px 16px;font-size:12px;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:.25s;pointer-events:none}.toast.show{transform:translate(-50%,0);opacity:1}
@media(min-width:521px){body{background:#ede7f0}.app{box-shadow:0 0 45px rgba(45,8,62,.26)}}
@media(prefers-reduced-motion:reduce){.feed{scroll-behavior:auto}.dot,.toast{transition:none}}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="topline"><button class="icon-btn" type="button" onclick="backToApp()" aria-label="Volver">‹</button>
    <div class="brand"><b>Uai Sô · Menú</b><span id="viewSubtitle">Descubre cada plato en video</span></div>
    <button class="icon-btn cart-btn" type="button" onclick="openCart()" aria-label="Abrir carrito">🛒<span id="cartCount" class="cart-count hidden">0</span></button></div>
    <div class="view-switch" role="tablist" aria-label="Vista del menú"><button id="exploreTab" class="active" type="button" role="tab" aria-selected="true" onclick="setView('explore')">▶ Explorar</button><button id="catalogTab" type="button" role="tab" aria-selected="false" onclick="setView('catalog')">☰ Menú</button></div>
  </header>

  <section id="feed" class="feed" aria-label="Menú en video"></section>
  <div id="pager" class="pager" aria-hidden="true"></div>
  <section id="catalog" class="catalog hidden" aria-label="Menú tradicional">
    <div class="catalog-intro"><h1>¿Qué se te antoja?</h1><p>Encuentra rápido tus favoritos.</p></div>
    <label class="search"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"></circle><path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg><input id="menuSearch" type="search" placeholder="Buscar en el menú" autocomplete="off" oninput="renderCatalog()" aria-label="Buscar en el menú"></label>
    <nav id="categories" class="categories" aria-label="Categorías del menú"></nav>
    <div id="productList" class="product-list"></div>
  </section>

  <div id="detailsWrap" class="sheet-wrap" onclick="if(event.target===this)closeDetails()">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="detailName">
      <div class="handle"></div><div class="sheet-head"><h2 id="detailName"></h2><button class="close" type="button" onclick="closeDetails()" aria-label="Cerrar">×</button></div>
      <p id="detailDescription" class="sheet-copy"></p><div id="detailIngredients" class="ingredients"></div>
      <div id="detailOptions"></div>
      <div class="option-block"><div class="option-title"><strong>Indicaciones especiales</strong><span>Opcional</span></div><textarea id="detailNote" class="notes" maxlength="180" placeholder="Ej.: sin cebolla, bien dorada..."></textarea></div>
      <div class="price-line"><span>Total</span><strong id="detailPrice"></strong></div>
      <button id="detailOrder" class="primary" type="button">AGREGAR AL PEDIDO</button>
      <div class="prototype-note">Prototipo: videos, productos, descripciones y precios serán reemplazados por el menú real antes del lanzamiento.</div>
    </section>
  </div>

  <div id="videoWrap" class="video-wrap" onclick="if(event.target===this)closeVideo()">
    <section class="video-modal" role="dialog" aria-modal="true" aria-label="Video del producto">
      <button class="video-close" type="button" onclick="closeVideo()" aria-label="Cerrar video">×</button>
      <video id="popupVideo" controls playsinline></video>
      <button id="videoOrder" class="video-order" type="button">PERSONALIZAR Y PEDIR</button>
    </section>
  </div>

  <div id="cartWrap" class="sheet-wrap" onclick="if(event.target===this)closeCart()">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
      <div class="handle"></div><div class="sheet-head"><h2 id="cartTitle">Tu pedido</h2><button class="close" type="button" onclick="closeCart()" aria-label="Cerrar">×</button></div>
      <div id="cartList" class="cart-list"></div><div id="cartTotal" class="total"></div>
      <button id="sendOrder" class="primary whatsapp" type="button" onclick="sendWhatsApp()">ENVIAR PEDIDO POR WHATSAPP</button>
    </section>
  </div>
  <div id="toast" class="toast" role="status"></div>
</main>

<script>
const PRODUCTS=[
  {id:'esfiha-carne',name:'Esfiha de carne',category:'ESFIHAS ABIERTAS',price:50,video:'/media/esfiha-carne-demo.mp4',description:'Masa suave, borde dorado y carne sazonada al estilo brasileño.',ingredients:['Carne sazonada','Tomate','Cebolla','Limón','Masa artesanal'],extras:[{id:'catupiry',name:'Catupiry',price:15},{id:'queso-extra',name:'Queso extra',price:12}]},
  {id:'esfiha-queijo',name:'Esfiha de queso',category:'ESFIHAS ABIERTAS',price:50,video:'/media/esfiha-queijo-demo.mp4',description:'Queso cremoso sobre nuestra masa artesanal, horneada hasta dorar.',ingredients:['Queso','Masa artesanal','Hierbas'],extras:[{id:'catupiry',name:'Catupiry',price:15},{id:'queso-extra',name:'Queso extra',price:12}]},
  {id:'combo-esfihas',name:'Combo Uai Sô',category:'PARA COMPARTIR',price:280,video:'/media/combo-esfihas-demo.mp4',description:'Elige 6 esfihas, combina tus sabores favoritos y comparte.',ingredients:['6 esfihas','Sabores a elegir','Empaque para delivery'],choice:{required:6,options:[{id:'carne',name:'Carne',price:0},{id:'queso',name:'Queso',price:0},{id:'calabresa',name:'Calabresa',price:0},{id:'pollo-catupiry',name:'Pollo con Catupiry',price:8},{id:'dulce-leche',name:'Dulce de leche',price:8}]},extras:[{id:'coca-600',name:'Coca-Cola 600 ml',price:35},{id:'salsa-extra',name:'Salsa extra',price:10}]}
];
const MXN=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const qs=new URLSearchParams(location.search),uid=String(qs.get('uid')||'').trim();
let cart=readCart(),activeIndex=0,muted=true,toastTimer,menuView=localStorage.getItem('uaiso_menu_view')==='catalog'?'catalog':'explore',activeCategory='TODOS',detailState=null,videoProductId=null;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderFeed(){
  $('feed').innerHTML=PRODUCTS.map((p,i)=>`<article class="dish" data-index="${i}" data-id="${esc(p.id)}"><video muted loop playsinline preload="metadata" poster="/banner.jpg" src="${esc(p.video)}"></video><span class="demo">VIDEO DEMO</span><button class="sound" type="button" onclick="toggleSound(${i})" aria-label="Activar sonido">🔇</button><div class="content"><div class="eyebrow">${esc(p.category)}</div><h1>${esc(p.name)}</h1><p class="desc">${esc(p.description)}</p><div class="meta"><span class="chip">Desde ${MXN.format(p.price)}</span><span class="chip">Hecho al momento</span></div><div class="actions"><button class="details" type="button" onclick="openDetails('${esc(p.id)}')">VER DETALLES</button><button class="order" type="button" onclick="openDetails('${esc(p.id)}')">PEDIR · ${MXN.format(p.price)}</button></div></div></article>`).join('');
  $('pager').innerHTML=PRODUCTS.map((_,i)=>`<span class="dot ${i===0?'active':''}"></span>`).join('');
  observeVideos();
}
function observeVideos(){
  const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{const video=entry.target.querySelector('video');if(entry.isIntersecting&&entry.intersectionRatio>.65){activeIndex=Number(entry.target.dataset.index);updatePager();video.play().catch(()=>{})}else video.pause()}),{root:$('feed'),threshold:[.2,.65,.9]});
  document.querySelectorAll('.dish').forEach(x=>observer.observe(x));
}
function updatePager(){document.querySelectorAll('.dot').forEach((x,i)=>x.classList.toggle('active',i===activeIndex))}
function toggleSound(index){muted=!muted;document.querySelectorAll('.dish video').forEach(v=>v.muted=muted);document.querySelectorAll('.sound').forEach(b=>{b.textContent=muted?'🔇':'🔊';b.setAttribute('aria-label',muted?'Activar sonido':'Silenciar')});document.querySelector(`.dish[data-index="${index}"] video`)?.play().catch(()=>{})}

function setView(view){
  const previous=menuView;menuView=view==='catalog'?'catalog':'explore';localStorage.setItem('uaiso_menu_view',menuView);
  if(previous==='explore'&&menuView==='catalog'&&PRODUCTS[activeIndex])activeCategory=PRODUCTS[activeIndex].category;
  const catalog=menuView==='catalog';$('feed').classList.toggle('hidden',catalog);$('pager').classList.toggle('hidden',catalog);$('catalog').classList.toggle('hidden',!catalog);
  $('exploreTab').classList.toggle('active',!catalog);$('catalogTab').classList.toggle('active',catalog);$('exploreTab').setAttribute('aria-selected',String(!catalog));$('catalogTab').setAttribute('aria-selected',String(catalog));
  $('viewSubtitle').textContent=catalog?'Elige rápido por categoría':'Descubre cada plato en video';
  document.querySelectorAll('.dish video').forEach(v=>v.pause());
  if(catalog)renderCatalog();else document.querySelector(`.dish[data-index="${activeIndex}"] video`)?.play().catch(()=>{});
}
function setCategory(category){activeCategory=category;renderCatalog()}
function renderCategories(){const categories=['TODOS',...new Set(PRODUCTS.map(p=>p.category))];$('categories').innerHTML=categories.map(c=>`<button class="${c===activeCategory?'active':''}" type="button" onclick="setCategory('${esc(c)}')">${c==='TODOS'?'Todo':esc(c.replace(' ABIERTAS','').replace('PARA ','Para ').toLowerCase().replace(/^./,x=>x.toUpperCase()))}</button>`).join('')}
function renderCatalog(){
  renderCategories();const term=String($('menuSearch')?.value||'').trim().toLocaleLowerCase('es');const items=PRODUCTS.filter(p=>(activeCategory==='TODOS'||p.category===activeCategory)&&(!term||`${p.name} ${p.description} ${p.category}`.toLocaleLowerCase('es').includes(term)));
  $('productList').innerHTML=items.length?items.map(p=>`<article class="product-card"><button class="product-media" type="button" onclick="openVideo('${esc(p.id)}')" aria-label="Ver video de ${esc(p.name)}"><video muted playsinline preload="metadata" poster="/banner.jpg" src="${esc(p.video)}"></video><span>VER VIDEO</span></button><div class="product-body" role="button" tabindex="0" aria-label="Ver detalles de ${esc(p.name)}" onclick="if(!event.target.closest('button'))openDetails('${esc(p.id)}')" onkeydown="if((event.key==='Enter'||event.key===' ')&&event.target===this){event.preventDefault();openDetails('${esc(p.id)}')}"><small>${esc(p.category)}</small><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><div class="product-foot"><span class="product-price">Desde ${MXN.format(p.price)}</span><button class="add-small" type="button" onclick="openDetails('${esc(p.id)}')" aria-label="Personalizar ${esc(p.name)}">+</button></div></div></article>`).join(''):'<div class="empty-search">No encontramos productos con esa búsqueda.</div>';
}

function product(id){return PRODUCTS.find(x=>x.id===id)}
function openVideo(id){
  const p=product(id);if(!p)return;videoProductId=id;document.querySelectorAll('video').forEach(v=>v.pause());
  const player=$('popupVideo');player.src=p.video;player.muted=false;player.currentTime=0;$('videoOrder').textContent=`PERSONALIZAR Y PEDIR · ${MXN.format(p.price)}`;$('videoOrder').onclick=()=>{closeVideo(false);openDetails(id)};$('videoWrap').classList.add('open');player.play().catch(()=>{});
}
function closeVideo(resume=true){const player=$('popupVideo');player.pause();player.removeAttribute('src');player.load();$('videoWrap').classList.remove('open');videoProductId=null;if(resume&&menuView==='explore')document.querySelector(`.dish[data-index="${activeIndex}"] video`)?.play().catch(()=>{})}

function openDetails(id){
  const p=product(id);if(!p)return;detailState={productId:id,choices:{},extras:new Set()};$('detailName').textContent=p.name;$('detailDescription').textContent=p.description;$('detailIngredients').innerHTML=p.ingredients.map(x=>`<span>${esc(x)}</span>`).join('');$('detailNote').value='';$('detailOrder').onclick=addConfiguredToCart;renderDetailOptions();$('detailsWrap').classList.add('open');
}
function closeDetails(){$('detailsWrap').classList.remove('open');detailState=null}
function selectedChoiceCount(){return detailState?Object.values(detailState.choices).reduce((n,v)=>n+(Number(v)||0),0):0}
function changeFlavor(id,delta){
  if(!detailState)return;const p=product(detailState.productId),required=p?.choice?.required||0,current=Math.max(0,Number(detailState.choices[id])||0),total=selectedChoiceCount();if(delta>0&&total>=required)return;const next=Math.max(0,current+delta);if(next)detailState.choices[id]=next;else delete detailState.choices[id];renderDetailOptions();
}
function toggleExtra(id,checked){if(!detailState)return;if(checked)detailState.extras.add(id);else detailState.extras.delete(id);updateDetailTotal()}
function detailTotal(){
  if(!detailState)return 0;const p=product(detailState.productId);let total=Number(p?.price)||0;(p?.choice?.options||[]).forEach(x=>total+=(Number(detailState.choices[x.id])||0)*(Number(x.price)||0));(p?.extras||[]).forEach(x=>{if(detailState.extras.has(x.id))total+=Number(x.price)||0});return total;
}
function updateDetailTotal(){
  if(!detailState)return;const p=product(detailState.productId),complete=!p.choice||selectedChoiceCount()===p.choice.required;$('detailPrice').textContent=MXN.format(detailTotal());$('detailOrder').disabled=!complete;$('detailOrder').textContent=complete?`AGREGAR · ${MXN.format(detailTotal())}`:`ELIGE ${p.choice.required-selectedChoiceCount()} MÁS`;
}
function renderDetailOptions(){
  if(!detailState)return;const p=product(detailState.productId),blocks=[];
  if(p.choice){const count=selectedChoiceCount(),complete=count===p.choice.required;blocks.push(`<div class="option-block"><div class="option-title"><strong>Elige ${p.choice.required} sabores</strong><span class="${complete?'complete':''}">${count} de ${p.choice.required}</span></div><div class="flavor-list">${p.choice.options.map(x=>{const qty=Number(detailState.choices[x.id])||0,full=count>=p.choice.required;return`<div class="flavor-row"><div><b>${esc(x.name)}</b><small>${x.price?`+ ${MXN.format(x.price)} por pieza`:'Sin costo extra'}</small></div><div class="mini-qty"><button type="button" onclick="changeFlavor('${esc(x.id)}',-1)" ${qty?'':'disabled'} aria-label="Quitar ${esc(x.name)}">−</button><b>${qty}</b><button type="button" onclick="changeFlavor('${esc(x.id)}',1)" ${full?'disabled':''} aria-label="Agregar ${esc(x.name)}">+</button></div></div>`}).join('')}</div></div>`)}
  if(p.extras?.length)blocks.push(`<div class="option-block"><div class="option-title"><strong>Agrega algo más</strong><span>Opcional</span></div><div class="extras">${p.extras.map(x=>`<label class="extra"><input type="checkbox" ${detailState.extras.has(x.id)?'checked':''} onchange="toggleExtra('${esc(x.id)}',this.checked)"><b>${esc(x.name)}</b><span>+ ${MXN.format(x.price)}</span></label>`).join('')}</div></div>`);
  $('detailOptions').innerHTML=blocks.join('');updateDetailTotal();
}
function addConfiguredToCart(){
  if(!detailState)return;const p=product(detailState.productId);if(p.choice&&selectedChoiceCount()!==p.choice.required)return;
  const choices=(p.choice?.options||[]).map(x=>({id:x.id,name:x.name,qty:Number(detailState.choices[x.id])||0})).filter(x=>x.qty),extras=(p.extras||[]).filter(x=>detailState.extras.has(x.id)).map(x=>({id:x.id,name:x.name,price:x.price})),note=String($('detailNote').value||'').trim(),unitPrice=detailTotal(),signature=JSON.stringify({productId:p.id,choices:choices.map(x=>[x.id,x.qty]),extras:extras.map(x=>x.id),note});let line=cart.find(x=>x.signature===signature);
  if(line)line.qty+=1;else cart.push({lineId:`${Date.now()}_${Math.random().toString(36).slice(2,7)}`,signature,productId:p.id,qty:1,unitPrice,choices,extras,note});saveCart();closeDetails();showToast('Agregado a tu pedido');
}
function readCart(){
  try{const raw=JSON.parse(localStorage.getItem('uaiso_video_cart')||'[]');if(Array.isArray(raw))return raw.filter(x=>x&&x.productId&&Number(x.qty)>0);if(raw&&typeof raw==='object')return Object.entries(raw).map(([id,qty])=>{const p=product(id);return p&&Number(qty)>0?{lineId:`legacy_${id}`,signature:`legacy_${id}`,productId:id,qty:Number(qty),unitPrice:p.price,choices:[],extras:[],note:''}:null}).filter(Boolean);return[]}catch{return[]}
}
function saveCart(){localStorage.setItem('uaiso_video_cart',JSON.stringify(cart));renderCartBadge()}
function changeQty(lineId,delta){const line=cart.find(x=>x.lineId===lineId);if(!line)return;line.qty=Math.max(0,(Number(line.qty)||0)+delta);cart=cart.filter(x=>x.qty>0);saveCart();renderCart()}
function cartItems(){return cart.map(line=>({line,p:product(line.productId),qty:Number(line.qty)||0})).filter(x=>x.p&&x.qty>0)}
function renderCartBadge(){const count=cartItems().reduce((n,x)=>n+x.qty,0);$('cartCount').textContent=count>9?'9+':count;$('cartCount').classList.toggle('hidden',count===0)}
function openCart(){renderCart();$('cartWrap').classList.add('open')}
function closeCart(){$('cartWrap').classList.remove('open')}
function lineDetails(line){const parts=[];if(line.choices?.length)parts.push(line.choices.map(x=>`${x.qty} ${x.name}`).join(', '));if(line.extras?.length)parts.push(`Extra: ${line.extras.map(x=>x.name).join(', ')}`);if(line.note)parts.push(`Nota: ${line.note}`);return parts.join(' · ')}
function renderCart(){const items=cartItems();$('cartList').innerHTML=items.length?items.map(({line,p,qty})=>{const details=lineDetails(line);return`<div class="cart-row"><div><b>${esc(p.name)}</b>${details?`<small>${esc(details)}</small>`:''}<small>${MXN.format(line.unitPrice)} cada</small></div><div class="qty"><button type="button" onclick="changeQty('${esc(line.lineId)}',-1)" aria-label="Quitar uno">−</button><b>${qty}</b><button type="button" onclick="changeQty('${esc(line.lineId)}',1)" aria-label="Agregar uno">+</button></div></div>`}).join(''):'<div class="cart-empty">Tu carrito está vacío.<br>Desliza el menú y elige algo rico.</div>';const total=items.reduce((n,x)=>n+(Number(x.line.unitPrice)||0)*x.qty,0);$('cartTotal').innerHTML=items.length?`<span>Total estimado</span><strong>${MXN.format(total)}</strong>`:'';$('sendOrder').hidden=!items.length}
function sendWhatsApp(){const items=cartItems();if(!items.length)return;const total=items.reduce((n,x)=>n+(Number(x.line.unitPrice)||0)*x.qty,0),lines=items.map(x=>{const details=lineDetails(x.line);return`• ${x.qty}x ${x.p.name} — ${MXN.format(x.line.unitPrice*x.qty)}${details?`\n  ${details}`:''}`}),client=/^user_\d+$/.test(uid)?`\nCliente fidelidad: #${uid.replace('user_','')}`:'';const text=`Hola! Quiero hacer este pedido:\n\n${lines.join('\n')}\n\nTotal estimado: ${MXN.format(total)}${client}`;window.open('https://api.whatsapp.com/send?phone=5219986023759&text='+encodeURIComponent(text),'_blank','noopener')}
function showToast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1700)}
function backToApp(){location.href=`/app-v11-next.html${/^user_\d+$/.test(uid)?'?uid='+encodeURIComponent(uid):''}#home`}
document.addEventListener('keydown',event=>{if(event.key!=='Escape')return;if($('videoWrap').classList.contains('open'))closeVideo();else if($('detailsWrap').classList.contains('open'))closeDetails();else if($('cartWrap').classList.contains('open'))closeCart()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return document.querySelectorAll('video').forEach(v=>v.pause());if(videoProductId)$('popupVideo').play().catch(()=>{});else if(menuView==='explore')document.querySelector(`.dish[data-index="${activeIndex}"] video`)?.play().catch(()=>{})});
renderFeed();renderCartBadge();setView(menuView);
</script>
</body>
</html>
