name: Add client movements link

on:
  push:
    branches:
      - feat/client-movements
    paths:
      - .github/workflows/add-client-movements-link.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-movements

      - name: Add movements access to client home
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'client-movements-link' not in s:
              css='''\n.client-movements-link {\n    display:flex;\n    align-items:center;\n    justify-content:space-between;\n    gap:12px;\n    text-decoration:none;\n    background:#fff;\n    border:1px solid #ece7f1;\n    color:#333;\n    padding:13px 15px;\n    border-radius:16px;\n    margin:-5px 0 16px 0;\n    box-shadow:0 4px 14px rgba(0,0,0,.04);\n}\n.client-movements-link .mov-left { display:flex; align-items:center; gap:11px; min-width:0; }\n.client-movements-link .mov-icon {\n    width:38px; height:38px; border-radius:12px; background:#f3e8ff; color:#6a0dad;\n    display:flex; align-items:center; justify-content:center; flex:none;\n}\n.client-movements-link b { display:block; color:#6a0dad; font-size:14px; }\n.client-movements-link small { display:block; color:#888; font-size:11px; margin-top:2px; }\n.client-movements-link .mov-arrow { color:#6a0dad; font-size:18px; font-weight:800; }\n'''
              s=s.replace('\n</style>', css+'\n</style>',1)
              marker='''            <button onclick="abrirQrPopup()" class="client-qr-button" aria-label="Mostrar mi QR">\n                <i class="fas fa-qrcode"></i>\n                <span>MOSTRAR MI QR</span>\n            </button>\n        </div>'''
              block=marker+'''\n\n        <a href="/movimientos.html" class="client-movements-link">\n            <span class="mov-left">\n                <span class="mov-icon"><i class="fas fa-clock-rotate-left"></i></span>\n                <span><b>Mis movimientos</b><small>Compras, puntos y canjes</small></span>\n            </span>\n            <span class="mov-arrow">›</span>\n        </a>'''
              if marker not in s:
                  raise SystemExit('Points card marker not found')
              s=s.replace(marker,block,1)
              p.write_text(s)
          PY

      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add movements access to client home"
          git push origin HEAD:feat/client-movements
