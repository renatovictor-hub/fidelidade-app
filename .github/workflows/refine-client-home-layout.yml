name: Refine client home layout

on:
  push:
    branches:
      - feat/client-home-layout
    paths:
      - .github/workflows/refine-client-home-layout.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-home-layout
      - name: Apply approved layout
        run: python scripts/refine_client_home.py
      - name: Commit layout
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine client home layout"
          git push origin HEAD:feat/client-home-layout
